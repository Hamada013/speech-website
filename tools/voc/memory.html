<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة الذاكرة - تطبيق حمادة</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        baby: {
                            blueLight: '#EBF8FF',
                            blue: '#E0F2FE',
                            blueMed: '#38BDF8',
                            blueDark: '#0284C7',
                            mintLight: '#ECFDF5',
                            mint: '#D1FAE5',
                            mintMed: '#34D399',
                            mintDark: '#059669',
                            bg: '#F8FAFC',
                            textDark: '#0F172A',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 14px 0 rgba(2, 132, 199, 0.12)',
                        'soft-mint': '0 4px 14px 0 rgba(5, 150, 105, 0.12)',
                        'glow-gold': '0 0 25px rgba(251, 191, 36, 0.6)',
                    },
                    animation: {
                        'star-celebrate': 'starCelebrate 0.8s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        starCelebrate: {
                            '0%': { transform: 'scale(1) rotate(-5deg)' },
                            '100%': { transform: 'scale(1.15) rotate(5deg)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        .game-workspace {
            height: calc(100dvh - 68px);
            max-height: calc(100dvh - 68px);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(5px);
        }

        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="text-baby-textDark font-sans h-full w-full flex flex-col antialiased bg-slate-50 items-center justify-center">

    <div class="w-full h-full max-w-7xl mx-auto flex flex-col shadow-xl bg-white relative overflow-hidden">

        <div id="toast-container" class="fixed top-3 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none"></div>

        <!-- شاشة إعدادات لعبة الذاكرة (مطابقة تماماً لتصميم rapid.html بشريط جانبي للفئات) -->
        <div id="category-select-view" class="h-full w-full flex flex-col bg-gradient-to-b from-baby-blueLight via-white to-baby-mintLight overflow-hidden">
            <!-- شريط علوي -->
            <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white flex-shrink-0">
                <div class="flex items-center gap-3">
                    <a href="games.html" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition active:scale-95 flex-shrink-0">
                        <i class="fas fa-home text-lg"></i>
                    </a>
                    <h1 class="text-lg sm:text-xl font-black text-baby-blueDark">لعبة الذاكرة - الإعدادات</h1>
                </div>

                <div class="flex items-center gap-4">
                    <!-- اختيار عدد البطاقات -->
                    <div class="hidden sm:flex items-center gap-2 bg-slate-50 p-1 rounded-xl border border-slate-200">
                        <span class="text-xs font-bold text-slate-600 px-2">عدد البطاقات:</span>
                        <button onclick="memoryApp.setCardCount(4)" id="btn-count-4" class="count-btn px-3 py-1 rounded-lg text-xs font-black transition border border-baby-blueMed bg-baby-blueLight text-baby-blueDark">4</button>
                        <button onclick="memoryApp.setCardCount(6)" id="btn-count-6" class="count-btn px-3 py-1 rounded-lg text-xs font-black transition border border-slate-200 bg-white text-slate-600">6</button>
                        <button onclick="memoryApp.setCardCount(9)" id="btn-count-9" class="count-btn px-3 py-1 rounded-lg text-xs font-black transition border border-slate-200 bg-white text-slate-600">9</button>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <button onclick="memoryApp.selectAllCategories(true)" class="text-xs font-bold bg-baby-blue text-baby-blueDark px-3 py-1.5 rounded-xl hover:bg-sky-200 transition">تحديد الكل</button>
                        <button onclick="memoryApp.selectAllCategories(false)" class="text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-xl hover:bg-slate-200 transition">إلغاء الكل</button>
                    </div>
                </div>
            </header>

            <!-- محتوى رئيسي مقسم لشريط جانبي وفضاء عرض العناصر (مطابق لـ rapid.html) -->
            <div class="flex-grow flex overflow-hidden">
                <!-- الشريط الجانبي للفئات (قابل للتمرير) -->
                <aside class="w-64 sm:w-72 bg-white border-l border-slate-200 flex flex-col flex-shrink-0 overflow-y-auto no-scrollbar" id="sidebar-categories">
                    <!-- تعبئة ديناميكية لقائمة الفئات الجانبية -->
                </aside>

                <!-- منطقة عرض البطاقات والعناصر للفئة النشطة -->
                <main class="flex-grow flex flex-col bg-slate-50 overflow-hidden">
                    <!-- شريط تحكم الفئة الحالية (عنوان الفئة وأزرار تحديد عناصرها) -->
                    <div class="bg-white px-4 py-3 border-b border-slate-200 flex items-center justify-between flex-shrink-0 shadow-sm">
                        <h2 id="active-category-title" class="text-base sm:text-lg font-black text-baby-blueDark">الكلمات الأساسية</h2>
                        <div class="flex items-center gap-2">
                            <button onclick="memoryApp.selectCurrentCategoryItems(true)" class="text-xs font-bold bg-baby-mintLight text-baby-mintDark px-3 py-1.5 rounded-xl hover:bg-emerald-100 transition">حدد الكل</button>
                            <button onclick="memoryApp.selectCurrentCategoryItems(false)" class="text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-xl hover:bg-slate-200 transition">إلغاء تحديد الكل</button>
                        </div>
                    </div>

                    <!-- شبكة العناصر الفريدة داخل الفئة المحددة -->
                    <div class="flex-grow overflow-y-auto p-4 no-scrollbar" id="active-category-items-grid">
                        <!-- تعبئة ديناميكية لبطاقات العناصر -->
                    </div>
                </main>
            </div>

            <!-- ذيل الشاشة (عدد العناصر المختارة وزر البدء) -->
            <footer class="bg-white px-6 py-3 border-t border-slate-200 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-4">
                    <div class="text-xs sm:text-sm font-bold text-slate-600">
                        المحدد: <span id="selected-count-badge" class="text-baby-mintDark font-black">0</span> عناصر
                    </div>
                    <!-- اختيار عدد البطاقات للموبايل -->
                    <div class="flex sm:hidden items-center gap-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="memoryApp.setCardCount(4)" id="mob-btn-count-4" class="mob-count-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-baby-blue text-baby-blueDark">4</button>
                        <button onclick="memoryApp.setCardCount(6)" id="mob-btn-count-6" class="mob-count-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-white text-slate-600">6</button>
                        <button onclick="memoryApp.setCardCount(9)" id="mob-btn-count-9" class="mob-count-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-white text-slate-600">9</button>
                    </div>
                </div>

                <button onclick="memoryApp.startMemoryGame()" class="bg-baby-mintMed hover:bg-emerald-500 text-white font-black px-8 py-2.5 rounded-2xl shadow-soft-mint text-base transition transform active:scale-95 flex items-center gap-2">
                    <i class="fas fa-play"></i>
                    <span>ابدأ اللعبة</span>
                </button>
            </footer>
        </div>

        <!-- شاشة اللعب الفعلية للذاكرة -->
        <div id="game-play-view" class="h-full w-full flex flex-col hidden bg-slate-50">
            <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between z-20 shadow-sm h-[68px] flex-shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="memoryApp.backToSelection()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition active:scale-95" title="العودة للإعدادات">
                        <i class="fas fa-arrow-right text-lg"></i>
                    </button>
                    <span class="font-bold text-slate-700 text-sm sm:text-base">لعبة الذاكرة</span>
                </div>
                <div class="flex items-center gap-1.5 bg-slate-100 rounded-xl px-3 py-1 border border-slate-200 overflow-x-auto no-scrollbar max-w-[50vw] sm:max-w-none" id="game-stars-container">
                    <!-- النجوم -->
                </div>
            </header>

            <main class="game-workspace flex-grow p-4 relative flex flex-col items-center justify-center overflow-auto">
                <div id="memory-grid" class="grid justify-center items-center gap-4 sm:gap-6 w-full max-w-2xl mx-auto my-auto">
                    <!-- شبكة الكروت -->
                </div>
            </main>
        </div>

        <!-- نافذة الفوز بجولة الذاكرة -->
        <div id="win-modal" class="fixed inset-0 modal-backdrop z-[70] flex items-center justify-center hidden opacity-0 transition-opacity duration-300 p-4">
            <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-sm w-full border-4 border-baby-mintMed text-center flex flex-col items-center">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-baby-mintLight rounded-full flex items-center justify-center text-baby-mintDark text-3xl sm:text-4xl mb-4 shadow-sm">
                    <i class="fas fa-trophy"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-800 mb-2">رائع جداً! 🎉</h2>
                <p class="text-slate-600 font-bold text-sm sm:text-base mb-6">لقد وجدت جميع المطابقات بنجاح وكسبت نجمة جديدة!</p>
                <button onclick="memoryApp.nextRound()" class="w-full bg-baby-mintMed hover:bg-emerald-500 text-white font-extrabold text-lg py-3 rounded-2xl shadow-soft-mint transition transform active:scale-95">
                    العب مجدداً ✨
                </button>
            </div>
        </div>

        <!-- نافذة الاحتفال بالنجوم العشرة -->
        <div id="star-celebration-modal" class="fixed inset-0 modal-backdrop z-[80] flex items-center justify-center hidden opacity-0 transition-opacity duration-300 p-4">
            <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-sm w-full border-4 border-amber-300 text-center flex flex-col items-center">
                <div class="relative my-4">
                    <i class="fas fa-star text-amber-400 text-7xl sm:text-8xl drop-shadow-lg animate-star-celebrate"></i>
                    <i class="fas fa-crown text-amber-500 text-2xl sm:text-3xl absolute -top-4 left-1/2 transform -translate-x-1/2"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-800 mb-2">مبروك! حصلت على 10 نجوم! 🎉</h2>
                <p class="text-baby-blueDark font-bold text-sm sm:text-base mb-6">لقد جمعت ١٠ نجوم كاملة بنجاح مذهل في لعبة الذاكرة!</p>
                <button onclick="memoryApp.closeStarCelebration()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-lg py-3 rounded-2xl shadow-glow-gold transition transform active:scale-95">
                    متابعة ✨
                </button>
            </div>
        </div>

    </div>

                    toast.classList.add('translate-y-0', 'opacity-100');
                }, 10);

                    const isSelected = this.state.selectedItems.includes(key);

                    const cardEl = document.createElement('div');
                    cardEl.className = `flex flex-col items-center justify-between p-3 rounded-2xl border-2 cursor-pointer transition select-none bg-white relative ${

                            this.state.selectedItems = this.state.selectedItems.filter(k => k !== key);
                        } else {
                            this.state.selectedItems.push(key);
                        }
                        this.renderSidebar();
                        this.renderActiveCategoryContent();
                        document.getElementById('selected-count-badge').innerText = this.state.selectedItems.length;

            selectCurrentCategoryItems(select) {
                const cat = CATEGORIES[this.state.activeCategoryIndex];
                cat.items.forEach(item => {
                    const key = `${cat.id}-${item.id}`;
                    if (select) {
                        if (!this.state.selectedItems.includes(key)) {
                            this.state.selectedItems.push(key);
                        }
                    } else {
                        this.state.selectedItems = this.state.selectedItems.filter(k => k !== key);
                    }
                });
                this.renderSidebar();
                this.renderActiveCategoryContent();
            },

            selectAllCategories(select) {
                if (select) {
                    let allKeys = [];
                    CATEGORIES.forEach(cat => {
                        cat.items.forEach(item => {
                            allKeys.push(`${cat.id}-${item.id}`);
                        });
                    });
                    this.state.selectedItems = allKeys;
                } else {
                    this.state.selectedItems = [];
                }
                this.renderSidebar();
                this.renderActiveCategoryContent();
            },

            startMemoryGame() {
                if (this.state.selectedItems.length === 0) {
                    this.showToast('الرجاء اختيار عنصر واحد على الأقل للبدء', 'warning');
                    return;
                }

                document.getElementById('category-select-view').classList.add('hidden');
                document.getElementById('game-play-view').classList.remove('hidden');
                this.setupNewRound();
            },

            backToSelection() {
                document.getElementById('game-play-view').classList.add('hidden');
                document.getElementById('category-select-view').classList.remove('hidden');
            },

            setupNewRound() {
                this.state.flippedCards = [];
                this.state.matchedPairs = 0;
                this.state.isLocked = false;

                let requiredPairs = Math.floor(this.state.gridSize / 2);
                if (this.state.gridSize === 9) {
                    requiredPairs = 4; 
                }
                if (requiredPairs < 1) requiredPairs = 2;
                this.state.totalPairsToMatch = requiredPairs;

                let availableItems = [];
                this.state.selectedItems.forEach(key => {
                    const [catIdStr, itemIdStr] = key.split('-');
                    const catId = parseInt(catIdStr);
                    const itemId = parseInt(itemIdStr);
                    const cat = CATEGORIES.find(c => c.id === catId);
                    if (cat) {
                        const item = cat.items.find(i => i.id === itemId);
                        if (item) {
                            availableItems.push(item);
                        }
                    }
                });

                if (availableItems.length < requiredPairs) {
                    this.showToast(`العناصر المحددة لا تكفي لملء شبكة اللعبة، يرجى تحديد عناصر أكثر`, 'warning');
                    this.backToSelection();
                    return;
                }

                let shuffledItems = [...availableItems].sort(() => 0.5 - Math.random());
                let selectedItems = shuffledItems.slice(0, requiredPairs);

                let deck = [];
                selectedItems.forEach((item, index) => {
                    deck.push({ ...item, uniqueKey: `${item.catId}-${item.id}-1`, pairId: index });
                    deck.push({ ...item, uniqueKey: `${item.catId}-${item.id}-2`, pairId: index });
                });

                deck.sort(() => 0.5 - Math.random());
                this.renderBoard(deck);
            },

            renderBoard(deck) {
                const grid = document.getElementById('memory-grid');
                grid.innerHTML = '';

                let gridColsClass = 'grid-cols-2'; 
                if (this.state.gridSize === 6) {
                    gridColsClass = 'grid-cols-3'; 
                } else if (this.state.gridSize === 9) {
                    gridColsClass = 'grid-cols-3'; 
                }

                grid.className = `grid gap-4 sm:gap-6 w-full max-w-xl justify-center items-center ${gridColsClass} mx-auto`;

                deck.forEach((card, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'w-24 h-24 sm:w-32 sm:h-32 md:w-36 md:h-36 perspective-1000 cursor-pointer';
                    cardEl.dataset.pairId = card.pairId;
                    cardEl.dataset.index = index;

                    cardEl.innerHTML = `
                        <div class="card-inner relative w-full h-full duration-300 transform-style-3d shadow-soft rounded-2xl">
                            <!-- وجه الكرت المقلوب (الغلاف) -->
                            <div class="card-front absolute inset-0 w-full h-full bg-baby-blue border-2 border-baby-blueMed rounded-2xl flex flex-col items-center justify-center backface-hidden shadow-sm">
                                <i class="fas fa-question text-baby-blueDark text-2xl sm:text-3xl"></i>
                            </div>
                            <!-- وجه الكرت المكشوف (الصورة والاسم) -->
                            <div class="card-back absolute inset-0 w-full h-full bg-white border-2 border-baby-mintMed rounded-2xl flex flex-col items-center justify-between p-2 sm:p-3 backface-hidden rotate-y-180">
                                <div class="w-full flex-grow p-1 flex items-center justify-center overflow-hidden pointer-events-none">
                                    <img src="${card.image}" alt="${card.name}" class="max-h-full max-w-full object-contain">
                                </div>
                                <div class="w-full text-center text-[10px] sm:text-xs font-bold text-slate-700 truncate px-1 py-0.5 bg-slate-100 rounded-lg">
                                    ${card.name}
                                </div>
                            </div>
                        </div>
                    `;

                    cardEl.onclick = () => this.flipCard(cardEl, card);
                    grid.appendChild(cardEl);
                });
            },

            flipCard(cardEl, cardData) {
                if (this.state.isLocked) return;
                const inner = cardEl.querySelector('.card-inner');
                
                if (inner.classList.contains('rotate-y-180') || this.state.flippedCards.includes(cardEl)) {
                    return;
                }

                inner.classList.add('rotate-y-180');
                this.state.flippedCards.push({ element: cardEl, data: cardData });

                if (this.state.flippedCards.length === 2) {
                    this.checkForMatch();
                }
            },

            checkForMatch() {
                this.state.isLocked = true;
                const [card1, card2] = this.state.flippedCards;

                if (card1.data.pairId === card2.data.pairId) {
                    this.state.matchedPairs++;
                    this.state.flippedCards = [];
                    this.state.isLocked = false;

                    if (this.state.matchedPairs === this.state.totalPairsToMatch) {
                        setTimeout(() => this.handleRoundWin(), 500);
                    }
                } else {
                    setTimeout(() => {
                        card1.element.querySelector('.card-inner').classList.remove('rotate-y-180');
                        card2.element.querySelector('.card-inner').classList.remove('rotate-y-180');
                        this.state.flippedCards = [];
                        this.state.isLocked = false;
                    }, 800);
                }
            },

            handleRoundWin() {
                this.addStar();
                const modal = document.getElementById('win-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            },

            nextRound() {
                const modal = document.getElementById('win-modal');
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    this.setupNewRound();
                }, 300);
            },

            addStar() {
                if (this.state.stars < 10) {
                    this.state.stars++;
                    localStorage.setItem('hamada_stars', this.state.stars);
                    this.renderStars();

                    if (this.state.stars === 10) {
                        setTimeout(() => this.showStarCelebration(), 400);
                    }
                }
            },

            renderStars() {
                const container = document.getElementById('game-stars-container');
                if (!container) return;
                container.innerHTML = '';

                for (let i = 1; i <= 10; i++) {
                    const star = document.createElement('i');
                    if (i <= this.state.stars) {
                        star.className = "fas fa-star text-amber-400 text-sm sm:text-base drop-shadow-sm";
                    } else {
                        star.className = "far fa-star text-slate-300 text-sm sm:text-base";
                    }
                    container.appendChild(star);
                }
            },

            showStarCelebration() {
                const modal = document.getElementById('star-celebration-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            },

            closeStarCelebration() {
                const modal = document.getElementById('star-celebration-modal');
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    this.state.stars = 0;
                    localStorage.setItem('hamada_stars', 0);
                    this.renderStars();
                }, 300);
            }
        };

        window.onload = () => {
            memoryApp.init();
        };
    </script>
</body>
</html>
