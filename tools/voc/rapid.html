<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>التمرير السريع - تطبيق حمادة</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        baby: {
                            blueLight: '#EBF8FF',
                            blue: '#E0F2FE',
                            blueMed: '#38BDF8',
                            blueDark: '#0284C7',
                            mintLight: '#ECFDF5',
                            mint: '#D1FAE5',
                            mintMed: '#34D399',
                            mintDark: '#059669',
                            bg: '#F8FAFC',
                            textDark: '#0F172A',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 14px 0 rgba(2, 132, 199, 0.12)',
                        'soft-mint': '0 4px 14px 0 rgba(5, 150, 105, 0.12)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-baby-textDark font-sans h-full w-full flex flex-col items-center justify-center antialiased bg-slate-50 overflow-hidden">

    <div class="w-full h-full max-w-7xl mx-auto flex flex-col shadow-xl bg-white relative overflow-hidden">

        <div id="toast-container" class="fixed top-3 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none"></div>

        <!-- شاشة إعدادات التمرير السريع -->
        <div id="category-select-view" class="h-full w-full flex flex-col bg-slate-50 overflow-hidden">
            <header class="flex items-center justify-between px-4 py-2.5 border-b border-slate-200 bg-white flex-shrink-0">
                <div class="flex items-center gap-3">
                    <a href="games.html" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition active:scale-95 flex-shrink-0">
                        <i class="fas fa-home text-base"></i>
                    </a>
                    <h1 class="text-sm sm:text-lg font-black text-baby-blueDark">التمرير السريع</h1>
                </div>

                <div class="flex items-center gap-2 sm:gap-4">
                    <div class="relative w-32 sm:w-60">
                        <input type="text" id="card-search-input" oninput="rapidApp.handleSearch(this.value)" placeholder="ابحث..." 
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl py-1 pr-7 sm:pr-8 pl-3 text-xs sm:text-sm font-bold text-slate-700 focus:outline-none focus:border-baby-blueDark transition">
                        <i class="fas fa-search absolute right-2.5 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                    </div>

                    <div class="hidden sm:flex items-center gap-1.5">
                        <button onclick="rapidApp.selectAllCategories(true)" class="text-xs font-bold bg-baby-blue text-baby-blueDark px-2.5 py-1 rounded-xl hover:bg-sky-200 transition">تحديد الكل</button>
                        <button onclick="rapidApp.selectAllCategories(false)" class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-xl hover:bg-slate-200 transition">إلغاء الكل</button>
                    </div>
                </div>
            </header>

            <div class="flex-grow flex overflow-hidden min-h-0">
                <aside class="w-40 sm:w-64 bg-white border-l border-slate-200 flex flex-col flex-shrink-0 overflow-y-auto no-scrollbar" id="sidebar-categories">
                </aside>

                <main class="flex-grow flex flex-col bg-slate-50 overflow-hidden min-h-0">
                    <div class="bg-white px-3 sm:px-4 py-2 border-b border-slate-200 flex items-center justify-between flex-shrink-0 shadow-sm">
                        <h2 id="active-category-title" class="text-xs sm:text-base font-black text-baby-blueDark truncate max-w-[130px] sm:max-w-none">جميع البطاقات</h2>
                        <div class="flex items-center gap-1.5">
                            <button onclick="rapidApp.selectCurrentCategoryItems(true)" class="text-[11px] sm:text-xs font-bold bg-baby-mintLight text-baby-mintDark px-2 py-1 rounded-xl hover:bg-emerald-100 transition">حدد الكل</button>
                            <button onclick="rapidApp.selectCurrentCategoryItems(false)" class="text-[11px] sm:text-xs font-bold bg-slate-100 text-slate-600 px-2 py-1 rounded-xl hover:bg-slate-200 transition">إلغاء</button>
                        </div>
                    </div>

                    <div class="flex-grow overflow-y-auto p-3 sm:p-5 no-scrollbar min-h-0" id="active-category-items-grid">
                    </div>
                </main>
            </div>

            <footer class="bg-white px-4 sm:px-6 py-2 border-t border-slate-200 flex items-center justify-between flex-shrink-0">
                <div class="text-xs sm:text-sm font-bold text-slate-600">
                    المحدد: <span id="selected-count-badge" class="text-baby-mintDark font-black">0</span> عناصر
                </div>

                <button onclick="rapidApp.startRapidGame()" class="bg-baby-mintMed hover:bg-emerald-500 text-white font-black px-6 sm:px-8 py-2 rounded-2xl shadow-soft-mint text-xs sm:text-sm transition transform active:scale-95 flex items-center gap-2">
                    <i class="fas fa-play"></i>
                    <span>ابدأ اللعبة</span>
                </button>
            </footer>
        </div>

        <!-- شاشة اللعب الفعلي -->
        <div id="game-play-view" class="h-full w-full flex flex-col hidden bg-gradient-to-b from-baby-blueLight via-white to-baby-mintLight overflow-hidden">
            <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between z-20 shadow-sm flex-shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="rapidApp.endGame()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition active:scale-95" title="العودة للإعدادات">
                        <i class="fas fa-arrow-right text-base"></i>
                    </button>
                    <span class="font-bold text-slate-700 text-xs sm:text-sm">التمرير السريع - التجربة (<span id="current-trial-num">1</span> / <span id="total-trials-num">10</span>)</span>
                </div>
            </header>

            <main class="flex-grow flex flex-col items-center justify-center p-3 sm:p-6 overflow-hidden min-h-0 relative">
                <div id="card-display-container" class="w-full max-w-[280px] sm:max-w-sm aspect-square bg-white rounded-3xl border-4 border-baby-blueDark shadow-xl flex flex-col items-center justify-center p-4 sm:p-6 relative transition-all duration-300">
                    <img id="game-card-img" src="" alt="" class="h-28 w-28 sm:h-48 sm:w-48 object-contain mb-3 sm:mb-4 pointer-events-none">
                    <h2 id="game-card-title" class="text-lg sm:text-2xl font-black text-slate-800 text-center truncate w-full"></h2>
                </div>

                <!-- Progress Bar below card with ending star -->
                <div class="w-full max-w-[280px] sm:max-w-sm mt-4 sm:mt-5 px-2 flex items-center gap-2">
                    <div class="flex-grow bg-slate-200 h-3 rounded-full overflow-hidden shadow-inner">
                        <div id="game-progress-bar" class="bg-baby-mintMed h-full w-0 transition-all duration-100"></div>
                    </div>
                    <div id="progress-star-icon" class="text-slate-300 text-lg sm:text-xl transition-colors duration-200 flex-shrink-0">
                        <i class="fas fa-star"></i>
                    </div>
                </div>

                <div id="feedback-buttons-container" class="mt-4 sm:mt-5 flex items-center gap-6 hidden">
                    <button onclick="rapidApp.handleTrialFeedback(false)" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-600 flex items-center justify-center text-xl sm:text-2xl font-black shadow-md transition active:scale-95">
                        <i class="fas fa-times"></i>
                    </button>
                    <button onclick="rapidApp.handleTrialFeedback(true)" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-emerald-100 hover:bg-emerald-200 text-emerald-600 flex items-center justify-center text-xl sm:text-2xl font-black shadow-md transition active:scale-95">
                        <i class="fas fa-check"></i>
                    </button>
                </div>

                <div id="success-overlay" class="absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
                    <div class="text-6xl text-baby-mintMed mb-4 animate-bounce"><i class="fas fa-star"></i></div>
                    <h2 class="text-2xl font-black text-slate-800">أحسنت! أنهيت الجولة بنجاح</h2>
                    <button onclick="rapidApp.startRapidGame()" class="mt-4 bg-baby-blueDark text-white font-black px-6 py-2 rounded-xl text-sm shadow-soft">لعب مرة أخرى</button>
                </div>
            </main>
        </div>

    </div>

        };

        const CATEGORIES = RAW_CATEGORIES.map((rawName, index) => {
            const id = index + 1;
            const name = rawName.substring(3).trim();
            const rawItems = CATEGORY_MAPS[id] || [];
            const items = rawItems.map((itemName, i) => ({
                id: i + 1,
                catId: id,
                uniqueKey: `${id}_${i + 1}`,
                name: itemName,
                image: `images/${id}/${i + 1}.png`,
                audio: `sounds/${id}/${i + 1}.wav`
            }));
            return { id, name, items };
        });

        const rapidApp = {
            state: {
                selectedCardKeys: [],
                activeCategoryIndex: 0,
                searchQuery: '',
                trialQueue: [],
                currentTrialIndex: 0,
                currentTrialItem: null,
                timerInterval: null,
                retryQueue: []
            },

            init() {
                this.renderSidebar();
                this.renderActiveCategoryContent();
            },

            showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                let bgColor = 'bg-slate-800';
                if(type === 'success') bgColor = 'bg-baby-mintDark';
                if(type === 'warning') bgColor = 'bg-amber-500';

                toast.className = `${bgColor} text-white px-4 py-2 rounded-xl shadow-lg flex items-center justify-center gap-2 text-xs sm:text-sm font-bold transition-all duration-300 transform translate-y-[-10px] opacity-0 pointer-events-auto`;
                toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i><span>${message}</span>`;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.classList.remove('translate-y-[-10px]', 'opacity-0');
                    toast.classList.add('translate-y-0', 'opacity-100');
                }, 10);

                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-[-10px]', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            },

            renderSidebar() {
                const sidebar = document.getElementById('sidebar-categories');
                sidebar.innerHTML = '';

                CATEGORIES.forEach((cat, index) => {
                    const isActive = index === this.state.activeCategoryIndex;
                    const catSelectedCount = cat.items.filter(item => this.state.selectedCardKeys.includes(item.uniqueKey)).length;

                    const itemEl = document.createElement('div');
                    itemEl.className = `flex items-center justify-between px-3 py-2.5 cursor-pointer transition border-b border-slate-100 ${
                        isActive 
                            ? 'bg-baby-blueLight text-baby-blueDark font-black border-r-4 border-baby-blueDark' 
                            : 'hover:bg-slate-50 text-slate-700 font-bold'
                    }`;

                    itemEl.innerHTML = `
                        <div class="flex items-center gap-2 truncate">
                            <span class="text-xs truncate">${cat.name}</span>
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            ${catSelectedCount > 0 ? `<span class="bg-baby-mintMed text-white text-[10px] px-1.5 py-0.2 rounded-full font-black">${catSelectedCount}</span>` : ''}
                            <i class="fas fa-chevron-left text-[9px] opacity-50"></i>
                        </div>
                    `;

                    itemEl.onclick = () => {
                        this.state.activeCategoryIndex = index;
                        this.renderSidebar();
                        this.renderActiveCategoryContent();
                    };

                    sidebar.appendChild(itemEl);
                });
            },

            renderActiveCategoryContent() {
                const cat = CATEGORIES[this.state.activeCategoryIndex];
                document.getElementById('active-category-title').textContent = cat.name;

                const grid = document.getElementById('active-category-items-grid');
                grid.innerHTML = '';

                const itemsGrid = document.createElement('div');
                itemsGrid.className = 'grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5 sm:gap-3';

                let itemsToShow = cat.items;
                const query = this.state.searchQuery.trim().toLowerCase();
                if (query) {
                    itemsToShow = cat.items.filter(item => item.name.toLowerCase().includes(query));
                }

                if (itemsToShow.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400 font-bold text-xs">لا توجد بطاقات مطابقة</div>`;
                    document.getElementById('selected-count-badge').innerText = this.state.selectedCardKeys.length;
                    return;
                }

                itemsToShow.forEach(item => {
                    const isSelected = this.state.selectedCardKeys.includes(item.uniqueKey);

                    const cardEl = document.createElement('div');
                    cardEl.className = `flex flex-col items-center justify-center p-2.5 aspect-square rounded-xl border-2 cursor-pointer transition select-none bg-white relative ${
                        isSelected 
                            ? 'border-baby-mintMed shadow-sm' 
                            : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                    }`;

                    cardEl.innerHTML = `
                        <div class="absolute top-1.5 right-1.5 w-4 h-4 rounded-full border-2 flex items-center justify-center transition ${
                            isSelected ? 'bg-baby-mintMed border-baby-mintMed text-white' : 'border-slate-300 bg-transparent'
                        }">
                            ${isSelected ? '<i class="fas fa-check text-[8px]"></i>' : ''}
                        </div>
                        <img src="${item.image}" alt="${item.name}" class="h-9 w-9 sm:h-11 sm:w-11 object-contain mb-1.5 pointer-events-none">
                        <span class="text-[10px] sm:text-xs font-bold text-slate-700 text-center w-full truncate">${item.name}</span>
                    `;

                    cardEl.onclick = () => {
                        if (isSelected) {
                            this.state.selectedCardKeys = this.state.selectedCardKeys.filter(k => k !== item.uniqueKey);
                        } else {
                            this.state.selectedCardKeys.push(item.uniqueKey);
                        }
                        this.renderSidebar();
                        this.renderActiveCategoryContent();
                    };

                    itemsGrid.appendChild(cardEl);
                });

                grid.appendChild(itemsGrid);
                document.getElementById('selected-count-badge').innerText = this.state.selectedCardKeys.length;
            },

            handleSearch(val) {
                this.state.searchQuery = val;
                this.renderActiveCategoryContent();
            },

            selectCurrentCategoryItems(select) {
                const cat = CATEGORIES[this.state.activeCategoryIndex];
                let itemsToCheck = cat.items;
                const query = this.state.searchQuery.trim().toLowerCase();
                if (query) {
                    itemsToCheck = cat.items.filter(item => item.name.toLowerCase().includes(query));
                }

                itemsToCheck.forEach(item => {
                    if (select) {
                        if (!this.state.selectedCardKeys.includes(item.uniqueKey)) {
                            this.state.selectedCardKeys.push(item.uniqueKey);
                        }
                    } else {
                        this.state.selectedCardKeys = this.state.selectedCardKeys.filter(k => k !== item.uniqueKey);
                    }
                });
                this.renderSidebar();
                this.renderActiveCategoryContent();
            },

            selectAllCategories(select) {
                if (select) {
                    let allKeys = [];
                    CATEGORIES.forEach(cat => {
                        cat.items.forEach(item => {
                            allKeys.push(item.uniqueKey);
                        });
                    });
                    this.state.selectedCardKeys = allKeys;
                } else {
                    this.state.selectedCardKeys = [];
                }
                this.renderSidebar();
                this.renderActiveCategoryContent();
            },

            startRapidGame() {
                if (this.state.selectedCardKeys.length < 1) {
                    this.showToast('الرجاء اختيار عنصر واحد على الأقل للبدء', 'warning');
                    return;
                }

                let pool = [];
                CATEGORIES.forEach(cat => {
                    cat.items.forEach(item => {
                        if (this.state.selectedCardKeys.includes(item.uniqueKey)) {
                            pool.push(item);
                        }
                    });
                });

                pool.sort(() => 0.5 - Math.random());
                this.state.trialQueue = pool.slice(0, Math.min(10, pool.length));
                this.state.currentTrialIndex = 0;
                this.state.retryQueue = [];

                document.getElementById('category-select-view').classList.add('hidden');
                document.getElementById('game-play-view').classList.remove('hidden');
                document.getElementById('success-overlay').classList.add('hidden');

                this.loadTrial();
            },

            endGame() {
                if (this.state.timerInterval) clearInterval(this.state.timerInterval);
                document.getElementById('game-play-view').classList.add('hidden');
                document.getElementById('category-select-view').classList.remove('hidden');
            },

            loadTrial() {
                if (this.state.timerInterval) clearInterval(this.state.timerInterval);

                if (this.state.currentTrialIndex >= this.state.trialQueue.length) {
                    if (this.state.retryQueue.length > 0) {
                        this.state.trialQueue = [...this.state.retryQueue];
                        this.state.retryQueue = [];
                        this.state.currentTrialIndex = 0;
                    } else {
                        this.showSuccessOverlay();
                        return;
                    }
                }

                document.getElementById('current-trial-num').innerText = this.state.currentTrialIndex + 1;
                document.getElementById('total-trials-num').innerText = this.state.trialQueue.length;

                const item = this.state.trialQueue[this.state.currentTrialIndex];
                this.state.currentTrialItem = item;

                document.getElementById('game-card-img').src = item.image;
                document.getElementById('game-card-title').innerText = item.name;
                document.getElementById('feedback-buttons-container').classList.add('hidden');

                try {
                    const audio = new Audio(item.audio);
                    audio.play().catch(e => console.log('تعذر تشغيل الصوت', e));
                } catch(e) {}

                const progressBar = document.getElementById('game-progress-bar');
                const starIcon = document.getElementById('progress-star-icon');
                
                progressBar.style.width = '0%';
                starIcon.className = 'text-slate-300 text-lg sm:text-xl transition-colors duration-200 flex-shrink-0';

                let startTime = Date.now();
                let duration = 2000;

                this.state.timerInterval = setInterval(() => {
                    let elapsed = Date.now() - startTime;
                    let progress = Math.min(100, (elapsed / duration) * 100);
                    progressBar.style.width = `${progress}%`;

                    if (progress >= 100) {
                        clearInterval(this.state.timerInterval);
                        starIcon.className = 'text-amber-400 text-lg sm:text-xl transition-colors duration-200 flex-shrink-0 animate-bounce';
                        document.getElementById('feedback-buttons-container').classList.remove('hidden');
                    }
                }, 50);
            },

            handleTrialFeedback(isCorrect) {
                if (!isCorrect) {
                    this.state.retryQueue.push(this.state.currentTrialItem);
                }
                this.state.currentTrialIndex++;
                this.loadTrial();
            },

            showSuccessOverlay() {
                const overlay = document.getElementById('success-overlay');
                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    overlay.classList.add('opacity-100');
                }, 10);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            rapidApp.init();
        });
    </script>
