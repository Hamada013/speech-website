<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الألعاب - تطبيق حمادة</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        baby: {
                            blueLight: '#EBF8FF',
                            blue: '#E0F2FE',
                            blueMed: '#38BDF8',
                            blueDark: '#0284C7',
                            mintLight: '#ECFDF5',
                            mint: '#D1FAE5',
                            mintMed: '#34D399',
                            mintDark: '#059669',
                            bg: '#F8FAFC',
                            textDark: '#0F172A',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 14px 0 rgba(2, 132, 199, 0.12)',
                        'soft-mint': '0 4px 14px 0 rgba(5, 150, 105, 0.12)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-baby-textDark font-sans h-full w-full flex flex-col items-center justify-center antialiased bg-slate-50 overflow-hidden">

    <div class="w-full h-full max-w-7xl mx-auto flex flex-col shadow-xl bg-white relative overflow-hidden">

        <!-- رأس الصفحة -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white flex-shrink-0">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition active:scale-95 flex-shrink-0" title="الرئيسية">
                    <i class="fas fa-home text-lg"></i>
                </a>
                <h1 class="text-base sm:text-xl font-black text-baby-blueDark">قسم الألعاب التفاعلية</h1>
            </div>
        </header>

        <!-- محتوى الألعاب -->
        <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-8 bg-gradient-to-b from-baby-blueLight via-white to-baby-mintLight overflow-y-auto no-scrollbar">
            <div class="w-full max-w-4xl text-center mb-6">
                <h2 class="text-xl sm:text-2xl font-black text-slate-800 mb-2">اختر لعبة للبدء!</h2>
                <p class="text-xs sm:text-sm font-bold text-slate-500">استمتع بتطوير مهاراتك من خلال مجموعة من الألعاب الممتعة</p>
            </div>

            <div class="w-full max-w-4xl grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                
                <!-- لعبة المطابقة -->
                <a href="matching.html" class="bg-white border-2 border-slate-100 hover:border-baby-blueMed rounded-3xl p-5 sm:p-6 shadow-soft flex items-center gap-4 transition transform hover:-translate-y-1 active:scale-98 group">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-baby-blueLight flex items-center justify-center text-baby-blueDark text-2xl sm:text-3xl flex-shrink-0 group-hover:bg-baby-blueDark group-hover:text-white transition">
                        <i class="fas fa-puzzle-piece"></i>
                    </div>
                    <div class="flex flex-col text-right">
                        <h3 class="text-base sm:text-lg font-black text-slate-800 group-hover:text-baby-blueDark transition">لعبة المطابقة</h3>
                        <p class="text-xs sm:text-sm font-bold text-slate-500 mt-1">طابق البطاقات المتشابهة واختبر تركيزك</p>
                    </div>
                </a>

                <!-- اللعبة السريعة -->
                <a href="rapid.html" class="bg-white border-2 border-slate-100 hover:border-baby-mintMed rounded-3xl p-5 sm:p-6 shadow-soft-mint flex items-center gap-4 transition transform hover:-translate-y-1 active:scale-98 group">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-baby-mintLight flex items-center justify-center text-baby-mintDark text-2xl sm:text-3xl flex-shrink-0 group-hover:bg-baby-mintDark group-hover:text-white transition">
                        <i class="fas fa-bolt"></i>
                    </div>
                    <div class="flex flex-col text-right">
                        <h3 class="text-base sm:text-lg font-black text-slate-800 group-hover:text-baby-mintDark transition">اللعبة السريعة</h3>
                        <p class="text-xs sm:text-sm font-bold text-slate-500 mt-1">اختبر سرعة بديهتك وردة فعلك</p>
                    </div>
                </a>

                <!-- لعبة الذاكرة -->
                <a href="memory.html" class="bg-white border-2 border-slate-100 hover:border-baby-blueMed rounded-3xl p-5 sm:p-6 shadow-soft flex items-center gap-4 transition transform hover:-translate-y-1 active:scale-98 group">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-baby-blueLight flex items-center justify-center text-baby-blueDark text-2xl sm:text-3xl flex-shrink-0 group-hover:bg-baby-blueDark group-hover:text-white transition">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="flex flex-col text-right">
                        <h3 class="text-base sm:text-lg font-black text-slate-800 group-hover:text-baby-blueDark transition">لعبة الذاكرة</h3>
                        <p class="text-xs sm:text-sm font-bold text-slate-500 mt-1">اقوى ذاكرتك وتذكر الأماكن والأشكال</p>
                    </div>
                </a>

                <!-- لعبة الاختبار -->
                <a href="test.html" class="bg-white border-2 border-slate-100 hover:border-baby-mintMed rounded-3xl p-5 sm:p-6 shadow-soft-mint flex items-center gap-4 transition transform hover:-translate-y-1 active:scale-98 group">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-baby-mintLight flex items-center justify-center text-baby-mintDark text-2xl sm:text-3xl flex-shrink-0 group-hover:bg-baby-mintDark group-hover:text-white transition">
                        <i class="fas fa-question-circle"></i>
                    </div>
                    <div class="flex flex-col text-right">
                        <h3 class="text-base sm:text-lg font-black text-slate-800 group-hover:text-baby-mintDark transition">لعبة الاختبار</h3>
                        <p class="text-xs sm:text-sm font-bold text-slate-500 mt-1">اجب عن الأسئلة واكتشف معلومات جديدة</p>
                    </div>
                </a>

            </div>
        </main>

    </div>

</body>
</html>
