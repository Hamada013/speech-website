<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>لعبة الذاكرة - Arabic Sounds with Hamada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            babyBlue: '#E0F2FE',
            babyBlueText: '#0369A1',
            babyPurple: '#F3E8FF',
            babyPurpleDark: '#E9D5FF',
            babyPurpleText: '#6B21A8',
            pastelBg: '#FAFAF9'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #FAFAF9;
      touch-action: manipulation;
    }
    .card-square { aspect-ratio: 1 / 1; }
    
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-pop {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .fallback-text { animation: popIn 0.2s ease-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-700 select-none bg-pastelBg">

  <header class="bg-white/85 backdrop-blur-md border-b border-sky-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <img 
          src="./images/logo.png" 
          alt="Logo" 
          class="w-9 h-9 object-contain rounded-full bg-sky-50 p-1 border border-sky-100"
          onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-9 h-9 rounded-full bg-sky-100 flex items-center justify-center font-bold text-sky-600 text-lg\'>H</div>';"
        />
        <h1 class="text-base md:text-lg font-bold tracking-wide text-sky-800 uppercase dir-ltr font-sans">
          arabic sounds with hamada
        </h1>
      </div>
      <a href="index.html" class="p-2 rounded-full bg-sky-50 hover:bg-sky-100 text-sky-600 transition-colors">
        <i class="fa-solid fa-house text-base"></i>
      </a>
    </div>
  </header>

  <main class="max-w-3xl w-full mx-auto p-4 flex-grow flex flex-col justify-start space-y-4">

    <!-- Game Navigation Tabs -->
    <div class="flex items-center justify-center p-1.5 bg-white rounded-2xl border border-sky-100 shadow-sm max-w-md mx-auto w-full">
      <div class="flex-1 py-2 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center space-x-1.5 space-x-reverse bg-babyPurple text-babyPurpleText shadow-sm cursor-default">
        <i class="fa-solid fa-brain"></i>
        <span>الذاكرة والمطابقة</span>
      </div>

      <a href="matching.html" class="flex-1 py-2 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center space-x-1.5 space-x-reverse text-gray-500 hover:text-sky-600">
        <i class="fa-solid fa-hand-pointer"></i>
        <span>المطابقة والسحب</span>
      </a>
    </div>

    <!-- MEMORY GAME VIEW -->
    <section id="game-memory-view" class="space-y-4">
      <div class="flex items-center justify-between bg-white p-3 rounded-2xl border border-purple-100 shadow-sm">
        <div>
          <h2 class="text-base md:text-lg font-black text-purple-900">لعبة الذاكرة والمطابقة</h2>
          <p class="text-[11px] text-gray-400">اقلب البطاقات واعثر على الصور المتطابقة</p>
        </div>
        <button 
          onclick="initMemoryGame()" 
          class="px-3 py-1.5 bg-babyPurple hover:bg-babyPurpleDark text-babyPurpleText font-bold text-xs rounded-xl border border-purple-200 flex items-center space-x-1 space-x-reverse active:scale-95 transition-all"
        >
          <i class="fa-solid fa-rotate-right"></i>
          <span>إعادة اللعب</span>
        </button>
      </div>

      <div id="memoryGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 md:gap-3.5 max-w-lg mx-auto w-full pt-1">
      </div>
    </section>

  </main>

  <!-- Feedback Overlay -->
  <div id="feedbackOverlay" class="fixed inset-0 pointer-events-none z-50 hidden flex items-center justify-center">
    <div id="feedbackBox" class="modal-pop p-5 rounded-3xl flex items-center justify-center shadow-lg bg-white/95 border-2">
    </div>
  </div>

  <footer class="mt-auto py-2 px-4 text-center text-[11px] text-gray-400 border-t border-sky-100/60 bg-pastelBg space-y-0.5">
    <div class="font-semibold text-gray-500 tracking-wider">SPEECH AND LANGUAGE PATHOLOGY</div>
    <div class="flex flex-wrap items-center justify-center gap-x-2 text-[10px] text-gray-400">
      <span>Ahmad Ghanem</span>
      <span>•</span>
      <span>Latakia - Syria</span>
      <span>•</span>
      <a href="mailto:slp.ahmadghanem@gmail.com" class="hover:text-sky-600 underline">slp.ahmadghanem@gmail.com</a>
    </div>
  </footer>

  <script>
    const LETTER_MAP = {
      'ا': 1,  'ب': 2,  'ت': 3,  'ث': 4,  'ج': 5,  'ح': 6,  'خ': 7,
      'د': 8,  'ذ': 9,  'ر': 10, 'ز': 11, 'س': 12, 'ش': 13, 'ص': 14,
      'ض': 15, 'ط': 16, 'ظ': 17, 'ع': 18, 'غ': 19, 'ف': 20, 'ق': 21,
      'ك': 22, 'ل': 23, 'م': 24, 'ن': 25, 'ه': 26, 'و': 27, 'ي': 28,
      'ء': 29
    };

    const ALL_LETTERS = Object.keys(LETTER_MAP);

    let audioCtx = null;
    let lastAudioPlayTime = 0;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playAudioForLetter(letter) {
      const now = Date.now();
      if (now - lastAudioPlayTime < 250) return; 
      lastAudioPlayTime = now;
      
      const soundIndex = LETTER_MAP[letter] || 1;
      const audioPath = `./sounds/${soundIndex}.wav`;
      const audio = new Audio(audioPath);
      
      audio.play().catch(() => {
        playFallbackBeep(300 + soundIndex * 15, 0.15);
      });
    }

    function playFallbackBeep(freq, duration) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Fallback beep failed.");
      }
    }

    function handleGameImgError(imgElem) {
      const letter = imgElem.dataset.letter || '?';
      imgElem.style.display = 'none'; 
      
      const parent = imgElem.parentElement;
      if (parent && !parent.querySelector('.fallback-text')) {
         const fallback = document.createElement('div');
         fallback.className = 'fallback-text text-5xl md:text-6xl font-black text-sky-400 flex items-center justify-center w-full h-full pointer-events-none';
         fallback.textContent = letter;
         parent.appendChild(fallback);
      }
    }

    function showFeedback(isCorrect) {
      const overlay = document.getElementById('feedbackOverlay');
      const box = document.getElementById('feedbackBox');

      if (isCorrect) {
        box.className = 'modal-pop p-5 rounded-3xl flex items-center justify-center shadow-lg bg-emerald-50 border-2 border-emerald-300 text-emerald-500';
        box.innerHTML = '<i class="fa-solid fa-circle-check text-6xl md:text-7xl"></i>';
      } else {
        box.className = 'modal-pop p-5 rounded-3xl flex items-center justify-center shadow-lg bg-rose-50 border-2 border-rose-300 text-rose-500';
        box.innerHTML = '<i class="fa-solid fa-circle-xmark text-6xl md:text-7xl"></i>';
      }

      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 900);
    }

    let memoryCards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let memoryLock = false;

    function initMemoryGame() {
      const grid = document.getElementById('memoryGrid');
      if (!grid) return;
      grid.innerHTML = ''; 
      flippedCards = [];
      matchedPairs = 0;
      memoryLock = false;

      const shuffled = [...ALL_LETTERS].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 6);
      const deck = [...selected, ...selected].sort(() => 0.5 - Math.random());

      memoryCards = deck.map((letter, idx) => ({
        id: idx,
        letter: letter,
        isFlipped: false,
        isMatched: false
      }));

      memoryCards.forEach((card, index) => {
        const cardElem = document.createElement('div');
        cardElem.className = 'card-square perspective-1000 cursor-pointer touch-manipulation';
        cardElem.id = `mem-card-${index}`;
        const imgIdx = LETTER_MAP[card.letter] || 1;

        cardElem.innerHTML = `
          <div id="mem-card-inner-${index}" class="w-full h-full relative transform-style-3d transition-transform duration-300 pointer-events-none">
            <div class="absolute inset-0 bg-babyPurple border-2 border-purple-200 rounded-2xl flex flex-col items-center justify-center shadow-sm backface-hidden pointer-events-none">
              <i class="fa-solid fa-puzzle-piece text-purple-300 text-3xl"></i>
            </div>
            <div class="absolute inset-0 bg-white border-2 border-purple-300 rounded-2xl flex flex-col items-center justify-between p-2 shadow-sm backface-hidden rotate-y-180 pointer-events-none">
              <div class="w-full flex-grow flex items-center justify-center overflow-hidden">
                <img src="./images/${imgIdx}.png" data-letter="${card.letter}" class="max-h-full max-w-full object-contain" onerror="handleGameImgError(this)" />
              </div>
              <span class="text-xl md:text-2xl font-black text-gray-800 mt-0.5">${card.letter}</span>
            </div>
          </div>
        `;

        cardElem.onclick = () => handleMemoryCardClick(index);
        grid.appendChild(cardElem);
      });
    }

    function handleMemoryCardClick(index) {
      if (memoryLock) return;
      const card = memoryCards[index];
      if (card.isFlipped || card.isMatched) return;

      card.isFlipped = true;
      document.getElementById(`mem-card-inner-${index}`).classList.add('rotate-y-180');
      
      getAudioContext();
      playAudioForLetter(card.letter);

      flippedCards.push({ index, letter: card.letter });

      if (flippedCards.length === 2) {
        memoryLock = true;
        const [first, second] = flippedCards;

        if (first.letter === second.letter) {
          memoryCards[first.index].isMatched = true;
          memoryCards[second.index].isMatched = true;
          matchedPairs++;

          setTimeout(() => {
            showFeedback(true);
            flippedCards = [];
            memoryLock = false;

            if (matchedPairs === 6) {
              setTimeout(() => alert('ممتاز! أتممت لعبة الذاكرة بنجاح 🎉'), 600);
            }
          }, 400);

        } else {
          setTimeout(() => {
            showFeedback(false);
            document.getElementById(`mem-card-inner-${first.index}`).classList.remove('rotate-y-180');
            document.getElementById(`mem-card-inner-${second.index}`).classList.remove('rotate-y-180');
            memoryCards[first.index].isFlipped = false;
            memoryCards[second.index].isFlipped = false;
            flippedCards = [];
            memoryLock = false;
          }, 1000);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMemoryGame();
    });
  </script>
</body>
</html>
