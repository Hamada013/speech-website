<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditory Discrimination Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        user-select: none; 
        -webkit-user-select: none;
        overscroll-behavior: none;
        background-color: #fafafa;
      }
      @keyframes popIn {
        0% { transform: scale(0.3); opacity: 0; }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      
      /* Styling matched to previous design */
      .text-header-title { color: #9bbcc7; }
      .bg-red-btn { background-color: #ef4444; }
      .bg-red-btn-hover { background-color: #dc2626; }
      .bg-red-light { background-color: #fee2e2; }
      .text-red-dark { color: #dc2626; }
      .bg-gray-light { background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-700 h-[100dvh] flex flex-col justify-between overflow-hidden">

    <!-- Success Audio -->
    <audio id="sound-success" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3"></audio>

    <!-- Giant Central Feedback Overlay -->
    <div id="central-feedback" class="fixed inset-0 flex items-center justify-center z-[200] hidden pointer-events-none bg-white/80 backdrop-blur-sm transition-all">
        <i id="feedback-icon-big" class="text-[7rem] drop-shadow-2xl"></i>
    </div>

    <!-- Catalog / Trial Selection Modal -->
    <div id="trial-modal" class="fixed inset-0 z-[150] flex items-center justify-center bg-black/40 backdrop-blur-xs hidden p-4" onclick="closeTrialModal(event)">
        <div class="bg-white rounded-3xl p-5 shadow-2xl max-w-lg w-full max-h-[85vh] flex flex-col animate-pop" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-100">
                <h3 id="modal-title" class="font-black text-lg text-slate-700">Select Trial</h3>
                <button onclick="toggleTrialModal(false)" class="p-2 text-gray-400 hover:text-slate-600 rounded-full transition cursor-pointer w-8 h-8 flex items-center justify-center bg-gray-100">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            <div id="trial-modal-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto pr-1 hide-scrollbar max-h-[60vh]">
                <!-- Dynamically Populated -->
            </div>
        </div>
    </div>

    <!-- ==================== VIEW 1: HOME SCREEN ==================== -->
    <div id="home-screen" class="absolute inset-0 bg-white z-[100] flex flex-col justify-between p-6 overflow-y-auto hide-scrollbar">
        <div class="w-full max-w-md mx-auto flex flex-col items-center justify-center my-auto py-6">
            <div class="w-20 h-20 bg-red-light text-red-dark rounded-3xl flex items-center justify-center mb-6 shadow-sm border border-red-100">
                <i class="fas fa-ear-listen text-4xl"></i>
            </div>
            <h1 class="font-black text-2xl md:text-3xl text-slate-800 text-center mb-2">Auditory Discrimination</h1>
            <p class="text-slate-500 text-sm text-center mb-8 font-medium">Select a training category to begin</p>

            <div class="flex flex-col gap-4 w-full">
                <!-- Level 1 -->
                <button onclick="switchView('level1')" class="group flex items-center p-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-red-300 hover:bg-red-50/30 transition shadow-sm cursor-pointer w-full text-left relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
                    <div class="h-12 w-12 bg-red-light text-red-dark rounded-xl flex items-center justify-center mr-4 shrink-0 font-bold">1</div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-base text-slate-800">Level 1</h3>
                        <p class="text-xs text-slate-500 truncate">أصوات متباينة غير متشابهة</p>
                    </div>
                </button>

                <!-- Level 2 -->
                <button onclick="switchView('level2')" class="group flex items-center p-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-red-300 hover:bg-red-50/30 transition shadow-sm cursor-pointer w-full text-left relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
                    <div class="h-12 w-12 bg-red-light text-red-dark rounded-xl flex items-center justify-center mr-4 shrink-0 font-bold">2</div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-base text-slate-800">Level 2</h3>
                        <p class="text-xs text-slate-500 truncate">أصوات متشابهة سمعياً</p>
                    </div>
                </button>

                <!-- Duration -->
                <button onclick="switchView('duration')" class="group flex items-center p-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-red-300 hover:bg-red-50/30 transition shadow-sm cursor-pointer w-full text-left relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
                    <div class="h-12 w-12 bg-red-light text-red-dark rounded-xl flex items-center justify-center mr-4 shrink-0 font-bold"><i class="fas fa-clock text-lg"></i></div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-base text-slate-800">Duration</h3>
                        <p class="text-xs text-slate-500 truncate">Long vs Short Training</p>
                    </div>
                </button>
            </div>
        </div>

        <footer class="w-full text-center text-[10px] text-gray-400 font-bold uppercase tracking-widest py-2 shrink-0">
            SPEECH AND LANGUAGE PATHOLOGY • AHMAD GHANEM
        </footer>
    </div>

    <!-- ==================== VIEW 2: LEVEL 1 & 2 WORKPLACE ==================== -->
    <div id="game-view-standard" class="hidden flex-1 flex-col justify-between w-full max-w-lg mx-auto overflow-hidden">
        <!-- Header -->
        <header class="w-full px-4 py-3 flex items-center justify-between bg-white shadow-sm z-50 shrink-0 border-b border-gray-100">
            <button onclick="returnToHome()" class="w-10 h-10 bg-gray-100 rounded-full text-slate-600 hover:bg-gray-200 transition flex items-center justify-center font-bold text-sm shrink-0 cursor-pointer" title="Home">
                <i class="fas fa-home"></i>
            </button>
            <div class="flex flex-col items-center flex-1 mx-2 overflow-hidden">
                <h2 id="standard-header-title" class="text-sm sm:text-base font-black text-header-title truncate w-full text-center">Level 1</h2>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="playTargetSound()" class="w-10 h-10 bg-red-light text-red-dark rounded-xl hover:bg-red-200 transition flex items-center justify-center font-bold text-sm cursor-pointer shadow-xs" title="Play Sound">
                    <i class="fas fa-volume-high"></i>
                </button>
                <button onclick="toggleTrialModal(true)" class="w-10 h-10 bg-gray-light text-slate-700 rounded-xl hover:bg-gray-200 transition flex items-center justify-center font-bold text-sm cursor-pointer shadow-xs" title="Catalog / Library">
                    <i class="fas fa-th-large"></i>
                </button>
                <button id="test-btn-standard" onclick="triggerTestMode()" class="px-3 h-10 bg-red-light text-red-dark rounded-xl hover:bg-red-200 transition flex items-center justify-center font-bold text-xs cursor-pointer shadow-xs gap-1" title="Test Mode (10 Trials)">
                    <i class="fas fa-bolt"></i>
                    <span id="test-counter-badge" class="hidden">0/10</span>
                </button>
            </div>
        </header>

        <!-- Two 1x1 Card Slots Workplace -->
        <div class="flex-1 flex flex-col items-center justify-center p-4 w-full gap-4 my-auto">
            <div class="grid grid-cols-2 gap-4 w-full max-w-sm">
                <!-- Card Slot A -->
                <div onclick="handleCardSelection('A')" class="bg-white rounded-3xl p-4 shadow-sm border-2 border-gray-100 hover:border-red-300 flex flex-col items-center justify-center cursor-pointer transition-transform active:scale-95 group">
                    <div class="w-32 h-32 bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-center p-2 mb-2 relative overflow-hidden">
                        <img id="slot-img-A" src="" alt="Sound A" class="w-full h-full object-contain pointer-events-none group-hover:scale-105 transition-transform">
                    </div>
                    <span id="slot-label-A" class="text-xs font-bold text-slate-600 truncate max-w-full" dir="rtl">...</span>
                </div>

                <!-- Card Slot B -->
                <div onclick="handleCardSelection('B')" class="bg-white rounded-3xl p-4 shadow-sm border-2 border-gray-100 hover:border-red-300 flex flex-col items-center justify-center cursor-pointer transition-transform active:scale-95 group">
                    <div class="w-32 h-32 bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-center p-2 mb-2 relative overflow-hidden">
                        <img id="slot-img-B" src="" alt="Sound B" class="w-full h-full object-contain pointer-events-none group-hover:scale-105 transition-transform">
                    </div>
                    <span id="slot-label-B" class="text-xs font-bold text-slate-600 truncate max-w-full" dir="rtl">...</span>
                </div>
            </div>
        </div>

        <p class="text-[10px] sm:text-xs text-gray-400 font-bold tracking-widest uppercase text-center shrink-0 pb-4">
            Listen to the sound • Choose the correct card
        </p>
    </div>

    <!-- ==================== VIEW 3: DURATION WORKPLACE ==================== -->
    <div id="game-view-duration" class="hidden flex-1 flex-col justify-between w-full max-w-md mx-auto overflow-hidden">
        <!-- Header -->
        <header class="w-full px-4 py-3 flex items-center justify-between bg-white shadow-sm z-50 shrink-0 border-b border-gray-100">
            <button onclick="returnToHome()" class="w-10 h-10 bg-gray-100 rounded-full text-slate-600 hover:bg-gray-200 transition flex items-center justify-center font-bold text-sm shrink-0 cursor-pointer" title="Home">
                <i class="fas fa-home"></i>
            </button>
            <div class="flex flex-col items-center flex-1 mx-2 overflow-hidden">
                <h2 class="text-sm sm:text-base font-black text-header-title truncate w-full text-center">Duration Training</h2>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="playDurationSound()" class="w-10 h-10 bg-red-light text-red-dark rounded-xl hover:bg-red-200 transition flex items-center justify-center font-bold text-sm cursor-pointer shadow-xs" title="Play Sound">
                    <i class="fas fa-volume-high"></i>
                </button>
                <button onclick="toggleTrialModal(true)" class="w-10 h-10 bg-gray-light text-slate-700 rounded-xl hover:bg-gray-200 transition flex items-center justify-center font-bold text-sm cursor-pointer shadow-xs" title="Catalog / Library">
                    <i class="fas fa-th-large"></i>
                </button>
            </div>
        </header>

        <!-- Duration Workplace: Vertical Bars & Centered Single Card -->
        <div class="flex-1 flex flex-col items-center justify-between py-2 px-4 w-full my-auto relative">
            <!-- Top Short Bar -->
            <button onclick="handleDurationAnswer('short')" class="w-24 sm:w-28 h-7 sm:h-9 bg-red-btn rounded-full shadow-md hover:bg-red-btn-hover active:scale-95 transition-transform cursor-pointer shrink-0" title="Short Sound"></button>

            <!-- Center Single Card -->
            <div onclick="playDurationSound()" class="bg-white rounded-[2rem] p-4 sm:p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 flex flex-col items-center justify-center cursor-pointer hover:scale-[1.02] active:scale-[0.98] transition-transform z-10 mx-auto w-56 sm:w-64 my-auto">
                <h3 id="dur-item-title" class="text-base sm:text-lg font-bold text-slate-800 mb-2 sm:mb-3 text-center" dir="rtl">...</h3>
                <div class="w-32 h-32 sm:w-40 sm:h-40 bg-[#f8fafc] rounded-2xl border-[3px] border-gray-50 flex items-center justify-center p-2 relative group overflow-hidden">
                    <img id="dur-card-img" src="" alt="Sound Item" class="w-full h-full object-contain pointer-events-none group-hover:scale-105 transition-transform">
                </div>
            </div>

            <!-- Bottom Long Bar -->
            <button onclick="handleDurationAnswer('long')" class="w-[85%] sm:w-[360px] max-w-md h-10 sm:h-12 bg-red-btn rounded-full shadow-md hover:bg-red-btn-hover active:scale-95 transition-transform cursor-pointer shrink-0" title="Long Sound"></button>
        </div>

        <p class="text-[9px] sm:text-xs text-gray-400 font-bold tracking-[0.15em] uppercase text-center shrink-0 pb-3 px-4">
            Click image to listen • Choose short or long
        </p>
    </div>

    <script>
        // Sound Library Mapping (1 to 50)
        const soundLibrary = {
            1: "غسالة", 2: "كاسة تنكسر", 3: "مكنسة قش", 4: "طيارة", 5: "منبه ساعة",
            6: "بيبي يبكي", 7: "عصفور", 8: "زمور سيارة", 9: "زحمة سير", 10: "ساعة",
            11: "بقرة", 12: "بطة", 13: "وزة", 14: "هلكوبتر", 15: "فرشاية اسنان",
            16: "بيبي مبسوط", 17: "جرس", 18: "غراب", 19: "موتور", 20: "دوش حمام",
            21: "موبايل", 22: "مي تواليت", 23: "صفارة شرطة", 24: "شاحنة صغيرة تمر", 25: "شخير رجل",
            26: "ببغاء", 27: "سيارة شرطة", 28: "خاروف", 29: "سيارات بالمدينة", 30: "قطار",
            31: "شاحنة تمر", 32: "قطة", 33: "كلاب", 34: "حمامة", 35: "سيارة اطفاء",
            36: "بنت تصرخ", 37: "ماعز", 38: "حصان", 39: "صب عصير", 40: "اسد",
            41: "صيصان", 42: "ضجة عالم", 43: "سعال بنت", 44: "مطر", 45: "ديك",
            46: "بوسة / قبلة", 47: "سيارة اسعاف", 48: "غلي ماء", 49: "باخرة", 50: "نهر جاري"
        };

        // Level 1 Trials: أصوات متباينة غير متشابهة
        const level1Trials = [
            { id: 1, soundA: 1, soundB: 17, target: 'A' },   // غسالة <-> جرس
            { id: 2, soundA: 2, soundB: 20, target: 'A' },   // كاسة تنكسر <-> دوش حمام
            { id: 3, soundA: 3, soundB: 21, target: 'A' },   // مكنسة قش <-> موبايل
            { id: 4, soundA: 4, soundB: 22, target: 'A' },   // طيارة <-> مي تواليت
            { id: 5, soundA: 5, soundB: 24, target: 'A' },   // منبه ساعة <-> شاحنة صغيرة تمر
            { id: 6, soundA: 6, soundB: 25, target: 'A' },   // بيبي يبكي <-> شخير رجل
            { id: 7, soundA: 7, soundB: 29, target: 'A' },   // عصفور <-> سيارات بالمدينة
            { id: 8, soundA: 8, soundB: 30, target: 'A' },   // زمور سيارة <-> قطار
            { id: 9, soundA: 9, soundB: 31, target: 'A' },   // زحمة سير <-> شاحنة تمر
            { id: 10, soundA: 10, soundB: 36, target: 'A' }, // ساعة <-> بنت تصرخ
            { id: 11, soundA: 14, soundB: 39, target: 'A' }, // هلكوبتر <-> صب عصير
            { id: 12, soundA: 44, soundB: 48, target: 'A' }, // مطر <-> غلي ماء
            { id: 13, soundA: 15, soundB: 42, target: 'A' }, // فرشاية اسنان <-> ضجة عالم
            { id: 14, soundA: 46, soundB: 43, target: 'A' }, // بوسة / قبلة <-> سعال بنت
            { id: 15, soundA: 16, soundB: 19, target: 'A' }  // بيبي مبسوط <-> موتور
        ];

        // Level 2 Trials: أصوات متشابهة سمعياً
        const level2Trials = [
            { id: 1, soundA: 11, soundB: 37, target: 'A' },  // بقرة <-> ماعز
            { id: 2, soundA: 12, soundB: 13, target: 'A' },  // بطة <-> وزة
            { id: 3, soundA: 28, soundB: 38, target: 'A' },  // خاروف <-> حصان
            { id: 4, soundA: 32, soundB: 40, target: 'A' },  // قطة <-> اسد
            { id: 5, soundA: 33, soundB: 41, target: 'A' },  // كلاب <-> صيصان
            { id: 6, soundA: 34, soundB: 45, target: 'A' },  // حمامة <-> ديك
            { id: 7, soundA: 26, soundB: 18, target: 'A' },  // ببغاء <-> غراب
            { id: 8, soundA: 23, soundB: 27, target: 'A' },  // صفارة شرطة <-> سيارة شرطة
            { id: 9, soundA: 35, soundB: 47, target: 'A' },  // سيارة اطفاء <-> سيارة اسعاف
            { id: 10, soundA: 49, soundB: 50, target: 'A' } // باخرة <-> نهر جاري
        ];

        // Duration Trials: All 50 sounds randomly assigned as 'short' or 'long'
        const durationTypes = ['short', 'long'];
        const durationTrials = [];
        for (let i = 1; i <= 50; i++) {
            // Pseudo-random assignment per sound index based on stable logic or Math.random
            const assignedType = (i * 7) % 2 === 0 ? 'short' : 'long';
            durationTrials.push({ id: i, sound: i, type: assignedType });
        }

        let currentMode = 'home';
        let currentIndex = 0;
        let currentTrial = null;
        let activeAudio = new Audio();

        // Test Mode State for Level 1 & 2
        let isTestModeActive = false;
        let testQueue = [];
        let testIndex = 0;
        let lockedPair = null;

        function switchView(mode) {
            currentMode = mode;
            isTestModeActive = false;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('game-view-standard').classList.add('hidden');
            document.getElementById('game-view-duration').classList.add('hidden');
            
            document.getElementById('test-btn-standard').classList.remove('hidden');
            document.getElementById('test-counter-badge').classList.add('hidden');

            if (mode === 'home') {
                document.getElementById('home-screen').classList.remove('hidden');
            } else if (mode === 'level1' || mode === 'level2') {
                document.getElementById('game-view-standard').classList.remove('hidden');
                document.getElementById('game-view-standard').classList.add('flex');
                document.getElementById('standard-header-title').innerText = mode === 'level1' ? 'Level 1: أصوات متباينة غير متشابهة' : 'Level 2: أصوات متشابهة سمعياً';
                currentIndex = 0;
                loadStandardTrial();
            } else if (mode === 'duration') {
                document.getElementById('game-view-duration').classList.remove('hidden');
                document.getElementById('game-view-duration').classList.add('flex');
                currentIndex = 0;
                loadDurationTrial();
            }
        }

        function returnToHome() {
            activeAudio.pause();
            switchView('home');
        }

        function getActiveTrialsList() {
            return currentMode === 'level1' ? level1Trials : level2Trials;
        }

        function loadStandardTrial(forceIdx = null) {
            const list = getActiveTrialsList();
            if (forceIdx !== null) currentIndex = forceIdx;
            
            if (!isTestModeActive) {
                currentTrial = list[currentIndex];
            } else {
                currentTrial = testQueue[testIndex];
            }

            document.getElementById('slot-img-A').src = `images/${currentTrial.soundA}.png`;
            document.getElementById('slot-img-B').src = `images/${currentTrial.soundB}.png`;
            document.getElementById('slot-label-A').innerText = `${currentTrial.soundA}. ${soundLibrary[currentTrial.soundA] || ''}`;
            document.getElementById('slot-label-B').innerText = `${currentTrial.soundB}. ${soundLibrary[currentTrial.soundB] || ''}`;

            buildTrialModalGrid();
            playTargetSound();
        }

        function playTargetSound() {
            if (!currentTrial) return;
            const targetSoundId = currentTrial.target === 'A' ? currentTrial.soundA : currentTrial.soundB;
            activeAudio.src = `sounds/${targetSoundId}.wav`;
            activeAudio.currentTime = 0;
            activeAudio.play().catch(e => console.log("Audio play blocked/missing:", e));
        }

        function handleCardSelection(selectedChoice) {
            const fbModal = document.getElementById('central-feedback');
            const fbIcon = document.getElementById('feedback-icon-big');
            fbModal.classList.remove('hidden');

            const isCorrect = selectedChoice === currentTrial.target;

            if (isCorrect) {
                fbIcon.className = 'fas fa-check-circle text-green-500 animate-pop';
                document.getElementById('sound-success').play().catch(e => {});
                
                setTimeout(() => {
                    fbModal.classList.add('hidden');
                    if (isTestModeActive) {
                        testIndex++;
                        if (testIndex >= testQueue.length) {
                            alert("Test Completed Successfully!");
                            isTestModeActive = false;
                            document.getElementById('test-counter-badge').classList.add('hidden');
                            loadStandardTrial(0);
                        } else {
                            document.getElementById('test-counter-badge').innerText = `${testIndex + 1}/10`;
                            loadStandardTrial();
                        }
                    } else {
                        currentIndex = (currentIndex + 1) % getActiveTrialsList().length;
                        loadStandardTrial();
                    }
                }, 900);
            } else {
                fbIcon.className = 'fas fa-times-circle text-red-500 animate-pop';
                setTimeout(() => {
                    fbModal.classList.add('hidden');
                }, 900);
            }
        }

        function triggerTestMode() {
            lockedPair = { soundA: currentTrial.soundA, soundB: currentTrial.soundB };
            testQueue = [];
            for (let i = 0; i < 10; i++) {
                const target = Math.random() < 0.5 ? 'A' : 'B';
                testQueue.push({
                    soundA: lockedPair.soundA,
                    soundB: lockedPair.soundB,
                    target: target
                });
            }
            isTestModeActive = true;
            testIndex = 0;
            document.getElementById('test-counter-badge').classList.remove('hidden');
            document.getElementById('test-counter-badge').innerText = `1/10`;
            loadStandardTrial();
        }

        function loadDurationTrial(forceIdx = null) {
            if (forceIdx !== null) currentIndex = forceIdx;
            currentTrial = durationTrials[currentIndex];

            const subfolder = currentTrial.type; // 'long' or 'short'
            activeAudio.src = `sounds/${subfolder}/${currentTrial.sound}.wav`;

            document.getElementById('dur-card-img').src = `images/${currentTrial.sound}.png`;
            document.getElementById('dur-item-title').innerText = `${currentTrial.sound}. ${soundLibrary[currentTrial.sound] || ''}`;

            buildTrialModalGrid();
            playDurationSound();
        }

        function playDurationSound() {
            activeAudio.currentTime = 0;
            activeAudio.play().catch(e => console.log("Duration audio play blocked/missing:", e));
        }

        function handleDurationAnswer(choiceType) {
            const fbModal = document.getElementById('central-feedback');
            const fbIcon = document.getElementById('feedback-icon-big');
            fbModal.classList.remove('hidden');

            const isCorrect = choiceType === currentTrial.type;

            if (isCorrect) {
                fbIcon.className = 'fas fa-check-circle text-green-500 animate-pop';
                document.getElementById('sound-success').play().catch(e => {});
                setTimeout(() => {
                    fbModal.classList.add('hidden');
                    currentIndex = (currentIndex + 1) % durationTrials.length;
                    loadDurationTrial();
                }, 900);
            } else {
                fbIcon.className = 'fas fa-times-circle text-red-500 animate-pop';
                setTimeout(() => {
                    fbModal.classList.add('hidden');
                }, 900);
            }
        }

        function toggleTrialModal(show) {
            const modal = document.getElementById('trial-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function closeTrialModal(e) {
            toggleTrialModal(false);
        }

        function buildTrialModalGrid() {
            const gridContainer = document.getElementById('trial-modal-grid');
            gridContainer.innerHTML = '';
            
            if (currentMode === 'duration') {
                document.getElementById('modal-title').innerText = "Duration Catalog (50 Trials)";
                durationTrials.forEach((trial, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `flex flex-col items-center p-3 rounded-2xl border transition cursor-pointer bg-gray-50 hover:border-red-300 shadow-sm ${currentIndex === idx ? 'border-red-400 bg-red-50 ring-2 ring-red-100' : 'border-gray-200'}`;
                    btn.onclick = () => { currentIndex = idx; toggleTrialModal(false); loadDurationTrial(); };
                    btn.innerHTML = `
                        <div class="w-12 h-12 bg-white rounded-xl p-1 border border-gray-100 flex items-center justify-center mb-1 shadow-xs">
                            <img src="images/${trial.sound}.png" class="w-full h-full object-contain pointer-events-none">
                        </div>
                        <span class="text-xs font-bold text-slate-700">Trial ${idx + 1}</span>
                        <span class="text-[9px] text-gray-400 uppercase font-bold">${trial.type}</span>
                    `;
                    gridContainer.appendChild(btn);
                });
            } else {
                document.getElementById('modal-title').innerText = currentMode === 'level1' ? "Level 1 Catalog" : "Level 2 Catalog";
                const list = getActiveTrialsList();
                list.forEach((trial, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `flex flex-col items-center p-3 rounded-2xl border transition cursor-pointer bg-gray-50 hover:border-red-300 shadow-sm ${currentIndex === idx && !isTestModeActive ? 'border-red-400 bg-red-50 ring-2 ring-red-100' : 'border-gray-200'}`;
                    btn.onclick = () => { isTestModeActive = false; document.getElementById('test-counter-badge').classList.add('hidden'); currentIndex = idx; toggleTrialModal(false); loadStandardTrial(); };
                    btn.innerHTML = `
                        <div class="flex items-center gap-1 mb-1">
                            <div class="w-8 h-8 bg-white rounded-lg p-0.5 border flex items-center justify-center"><img src="images/${trial.soundA}.png" class="w-full h-full object-contain"></div>
                            <div class="w-8 h-8 bg-white rounded-lg p-0.5 border flex items-center justify-center"><img src="images/${trial.soundB}.png" class="w-full h-full object-contain"></div>
                        </div>
                        <span class="text-xs font-bold text-slate-700">Trial ${idx + 1}</span>
                    `;
                    gridContainer.appendChild(btn);
                });
            }
        }
    </script>
</body>
</html>
