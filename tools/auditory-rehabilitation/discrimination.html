<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditory Discrimination - Same / Different</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'pastel-pink': '#ffd1dc',
              'pastel-blue': '#aec6cf',
              'pastel-green': '#b7e4c7',
              'pastel-purple': '#cbaacb',
              'pastel-text': '#5a5a5a'

    <style>
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        user-select: none; 
        -webkit-user-select: none;
        overscroll-behavior: none; 
      }
      @keyframes popIn {
        0% { transform: scale(0.3); opacity: 0; }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body class="bg-gray-50 text-pastel-text overflow-hidden h-[100dvh] flex flex-col">
    
    <!-- Success Audio -->
    <audio id="sound-success" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3"></audio>

    <!-- Giant Central Feedback Overlay -->
    <div id="central-feedback" class="fixed inset-0 flex items-center justify-center z-[100] hidden pointer-events-none bg-white bg-opacity-80 backdrop-blur-sm transition-all">
        <i id="feedback-icon-big" class="text-[10rem] md:text-[18rem] drop-shadow-2xl"></i>
    </div>

    <!-- Trial Selection Modal (Opened by Book Button) -->
    <div id="trial-modal" class="fixed inset-0 z-[120] flex items-center justify-center bg-black/40 backdrop-blur-xs hidden p-4" onclick="closeTrialModal(event)">
        <div class="bg-white rounded-3xl p-5 md:p-6 shadow-xl max-w-xl w-full max-h-[80vh] flex flex-col animate-pop" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
                <h3 class="font-black text-lg text-slate-700">Select Trial / Set</h3>
                <button onclick="toggleTrialModal(false)" class="p-2 text-gray-400 hover:text-slate-600 rounded-full transition cursor-pointer">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            <!-- Scrollable Image/Button Grid -->
            <div id="trial-modal-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto pr-1 hide-scrollbar max-h-[60vh]">
                <!-- Populated dynamically via JS -->
            </div>
        </div>
    </div>

    <!-- Header / Top Bar -->
    <header id="game-header" class="hidden w-full p-2 md:p-3 flex items-center justify-between bg-white shadow-sm z-50 shrink-0">
        <button onclick="returnToHome()" class="p-2 px-3 md:px-4 bg-gray-100 rounded-full text-pastel-text hover:bg-gray-200 transition flex items-center gap-2 font-bold text-xs md:text-base shrink-0">
            <i class="fas fa-arrow-left"></i>
            <span class="hidden md:inline">Home</span>
        </button>
        
        <!-- Phase Title -->
        <div class="flex flex-col items-center flex-1 mx-2">
            <h2 id="level-title" class="text-xs md:text-lg font-bold text-pastel-pink mb-0 text-center truncate">Discrimination Active</h2>
        </div>
        
        <!-- Right Header Controls: Book Button & Visual Help Toggle -->
        <div class="flex items-center gap-2 shrink-0">
            <button onclick="toggleTrialModal(true)" class="p-2 px-3 bg-pastel-pink/20 border-2 border-pastel-pink/40 rounded-xl text-slate-700 hover:bg-pastel-pink/30 transition flex items-center gap-1.5 font-bold text-xs md:text-base cursor-pointer" title="Select Trial">
                <i class="fas fa-book text-pastel-pink"></i>
            </button>
            <button id="help-toggle-btn" onclick="toggleVisualHelp()" class="p-2 px-3 bg-gray-100 rounded-xl text-pastel-text flex items-center gap-1.5 font-bold transition-colors text-xs md:text-base" title="Toggle Visual Support">
                <i class="fas fa-eye"></i>
                <span class="hidden md:inline">Help</span>
            </button>
        </div>
    </header>

    <!-- Home / Menu Screen -->
    <div id="home-screen" class="absolute inset-0 bg-white z-[60] flex flex-col items-center justify-between p-4 md:p-6 transition-all duration-300 overflow-y-auto hide-scrollbar">
        <div class="w-full max-w-4xl flex flex-col items-center justify-center my-auto py-2">
            <div class="flex items-center gap-3 mb-4 md:mb-6">
                <div class="h-10 w-10 md:h-14 md:w-14 bg-pastel-pink rounded-full shadow-md flex items-center justify-center">
                    <i class="fas fa-ear-listen text-white text-lg md:text-2xl"></i>
                </div>
                <h1 class="font-black text-xl md:text-3xl text-slate-700">Sound Discrimination</h1>
            </div>

            <!-- Mode Selection View -->
            <div id="main-menu-view" class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4 w-full max-w-3xl px-2">
                <button onclick="startPhase('A')" class="group flex flex-col items-center p-4 md:p-5 bg-pastel-pink bg-opacity-20 border-2 border-pastel-pink rounded-2xl hover:bg-opacity-40 transition hover:-translate-y-1 shadow-sm">
                    <i class="fas fa-shapes text-3xl md:text-4xl text-pastel-pink mb-2 md:mb-3 group-hover:scale-110 transition"></i>
                    <h3 class="font-bold text-sm md:text-lg text-slate-700">Phase A</h3>
                    <p class="text-[11px] md:text-xs text-center text-slate-500 mt-1">Dissimilar Sounds<br>(Same / Different)</p>
                </button>

                <button onclick="startPhase('B')" class="group flex flex-col items-center p-4 md:p-5 bg-pastel-green bg-opacity-20 border-2 border-pastel-green rounded-2xl hover:bg-opacity-40 transition hover:-translate-y-1 shadow-sm">
                    <i class="fas fa-layer-group text-3xl md:text-4xl text-pastel-green mb-2 md:mb-3 group-hover:scale-110 transition"></i>
                    <h3 class="font-bold text-sm md:text-lg text-slate-700">Phase B</h3>
                    <p class="text-[11px] md:text-xs text-center text-slate-500 mt-1">Similar Sounds<br>(Same / Different)</p>
                </button>

                <button onclick="window.location.href='duration.html'" class="group flex flex-col items-center p-4 md:p-5 bg-pastel-blue bg-opacity-20 border-2 border-pastel-blue rounded-2xl hover:bg-opacity-40 transition hover:-translate-y-1 shadow-sm">
                    <i class="fas fa-clock text-3xl md:text-4xl text-pastel-blue mb-2 md:mb-3 group-hover:scale-110 transition"></i>
                    <h3 class="font-bold text-sm md:text-lg text-slate-700">Long vs Short</h3>
                    <p class="text-[11px] md:text-xs text-center text-slate-500 mt-1">Duration Training<br>(Link to Duration)</p>
                </button>
            </div>
            
            <div class="mt-5">
                <button onclick="window.location.href='index.html'" class="p-2.5 px-6 bg-gray-100 rounded-full text-slate-600 font-bold hover:bg-gray-200 transition flex items-center gap-2 text-xs md:text-sm shadow-sm">
                    <i class="fas fa-arrow-left"></i> Return to Identification App
                </button>
            </div>
        </div>

        <footer class="w-full text-center text-[10px] md:text-xs text-gray-400 leading-relaxed uppercase tracking-wider py-2 shrink-0">
            SPEECH AND LANGUAGE PATHOLOGY<br>
            Ahmad Ghanem<br>
            Latakia - Syria<br>
            slp.ahmadghanem@gmail.com
        </footer>
    </div>

    <!-- Game Area -->
    <div id="game-area" class="hidden flex-1 flex-col items-center justify-between p-2 md:p-4 w-full max-w-3xl mx-auto overflow-hidden">
        
        <!-- Central Audio Trigger Box & Side Choice Buttons Layout -->
        <div class="flex-1 flex items-center justify-between w-full my-auto gap-3 px-1">
            
            <!-- Left Choice Button (Identical: Two Red Circles) -->
            <button onclick="handleAnswer('identical')" class="group flex items-center justify-center gap-2 p-3 sm:p-4 bg-pastel-green bg-opacity-30 border-2 border-pastel-green rounded-2xl hover:bg-opacity-50 active:scale-95 transition shadow-sm cursor-pointer w-24 sm:w-32 md:w-36 h-28 sm:h-36 shrink-0">
                <div class="w-5 h-5 sm:w-7 sm:h-7 bg-red-500 rounded-full shadow-sm group-hover:scale-110 transition"></div>
                <div class="w-5 h-5 sm:w-7 sm:h-7 bg-red-500 rounded-full shadow-sm group-hover:scale-110 transition"></div>
            </button>

            <!-- Central Audio Trigger Box -->
            <div class="flex-1 flex flex-col items-center justify-center max-w-xs sm:max-w-sm w-full">
                <div class="bg-white p-4 md:p-6 rounded-3xl shadow-sm border-2 border-gray-100 flex flex-col items-center justify-center w-full relative">
                    
                    <!-- Two Audio Buttons Next to Each Other -->
                    <div class="flex items-center justify-center gap-4 w-full">
                        
                        <!-- Sound 1 Button -->
                        <div class="flex flex-col items-center">
                            <button onclick="playSingleSound(1)" id="audio-btn-1" class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 bg-pastel-pink rounded-full text-white shadow-md hover:scale-105 active:scale-95 transition flex items-center justify-center cursor-pointer shrink-0 border-4 border-transparent">
                                <i id="icon-1" class="fas fa-volume-high text-xl sm:text-2xl md:text-3xl"></i>
                            </button>
                            <span class="text-[10px] font-bold text-gray-400 mt-1 uppercase tracking-wider">Sound 1</span>
                        </div>

                        <!-- Sound 2 Button -->
                        <div class="flex flex-col items-center">
                            <button onclick="playSingleSound(2)" id="audio-btn-2" class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 bg-pastel-pink rounded-full text-white shadow-md hover:scale-105 active:scale-95 transition flex items-center justify-center cursor-pointer shrink-0 border-4 border-transparent">
                                <i id="icon-2" class="fas fa-volume-high text-xl sm:text-2xl md:text-3xl"></i>
                            </button>
                            <span class="text-[10px] font-bold text-gray-400 mt-1 uppercase tracking-wider">Sound 2</span>
                        </div>

                    </div>
                    
                    <!-- Visual hint cards showing Sound A & Sound B (Hidden by default unless help is active) -->
                    <div id="visual-hints" class="hidden items-center justify-center gap-3 mt-4 pt-3 border-t border-gray-100 transition-all duration-300 w-full">
                        <div id="hint-card-1" class="flex flex-col items-center transition-all">
                            <div class="w-12 h-12 sm:w-14 sm:h-14 bg-gray-50 rounded-xl p-1 border-2 border-transparent shadow-sm flex items-center justify-center">
                                <img id="hint-img-1" src="" alt="Sound A" class="w-full h-full object-contain">
                            </div>
                        </div>
                        <i class="fas fa-arrow-right text-gray-300 text-xs"></i>
                        <div id="hint-card-2" class="flex flex-col items-center transition-all">
                            <div class="w-12 h-12 sm:w-14 sm:h-14 bg-gray-50 rounded-xl p-1 border-2 border-transparent shadow-sm flex items-center justify-center">
                                <img id="hint-img-2" src="" alt="Sound B" class="w-full h-full object-contain">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Choice Button (Different: Red Circle and Blue Triangle) -->
            <button onclick="handleAnswer('different')" class="group flex items-center justify-center gap-2 p-3 sm:p-4 bg-pastel-pink bg-opacity-30 border-2 border-pastel-pink rounded-2xl hover:bg-opacity-50 active:scale-95 transition shadow-sm cursor-pointer w-24 sm:w-32 md:w-36 h-28 sm:h-36 shrink-0">
                <div class="w-5 h-5 sm:w-7 sm:h-7 bg-red-500 rounded-full shadow-sm group-hover:scale-110 transition"></div>
                <div class="w-0 h-0 border-x-[10px] sm:border-x-[14px] border-x-transparent border-b-[18px] sm:border-b-[26px] border-b-blue-500 drop-shadow-sm group-hover:scale-110 transition"></div>
            </button>

        </div>
      
        <!-- Play Full Sequence Button / Main Trigger -->
        <div class="w-full flex items-center justify-center my-1 shrink-0">
            <button onclick="playTrialSequence()" id="play-all-btn" class="px-5 py-2.5 bg-pastel-pink text-white rounded-full font-bold shadow-md hover:bg-opacity-90 active:scale-95 transition flex items-center gap-2 text-xs md:text-sm">
                <i class="fas fa-play text-xs"></i> Play Full Trial Sequence
            </button>
        </div>

        <p class="text-[9px] sm:text-[10px] text-gray-400 my-0.5 font-semibold tracking-wider uppercase shrink-0">Listen carefully • Choose Same or Different</p>
    </div>

                { id: 4, soundA: 2, soundB: 2, type: 'identical', desc: 'كاسة تنكسر ➔ كاسة تنكسر' },
                { id: 5, soundA: 3, soundB: 21, type: 'different', desc: 'مكنسة قش ➔ موبايل' },
                { id: 6, soundA: 21, soundB: 21, type: 'identical', desc: 'موبايل ➔ موبايل' },

                { id: 16, soundA: 30, soundB: 30, type: 'identical', desc: 'قطار ➔ قطار' },
                { id: 17, soundA: 9, soundB: 31, type: 'different', desc: 'زحمة سير ➔ شاحنة تمر' },
                { id: 18, soundA: 9, soundB: 9, type: 'identical', desc: 'زحمة سير ➔ زحمة سير' },
                { id: 19, soundA: 10, soundB: 36, type: 'different', desc: 'ساعة ➔ بنت تصرخ' },
                { id: 20, soundA: 10, soundB: 10, type: 'identical', desc: 'ساعة ➔ ساعة' },
                { id: 21, soundA: 14, soundB: 39, type: 'different', desc: 'هلكوبتر ➔ صب عصير' },
                { id: 22, soundA: 39, soundB: 39, type: 'identical', desc: 'صب عصير ➔ صب عصير' },
                { id: 23, soundA: 15, soundB: 42, type: 'different', desc: 'فرشاية اسنان ➔ ضجة عالم' },
                { id: 24, soundA: 15, soundB: 15, type: 'identical', desc: 'فرشاية اسنان ➔ فرشاية اسنان' },
                { id: 25, soundA: 16, soundB: 19, type: 'different', desc: 'بيبي مبسوط ➔ موتور' },
                { id: 26, soundA: 19, soundB: 19, type: 'identical', desc: 'موتور ➔ موتور' }
            ],
            'B': [
                { id: 1, soundA: 11, soundB: 37, type: 'different', desc: 'بقرة ➔ ماعز' },
                { id: 2, soundA: 11, soundB: 11, type: 'identical', desc: 'بقرة ➔ بقرة' },
                { id: 3, soundA: 12, soundB: 13, type: 'different', desc: 'بطة ➔ وزة' },
                { id: 4, soundA: 13, soundB: 13, type: 'identical', desc: 'وزة ➔ وزة' },
                { id: 5, soundA: 28, soundB: 38, type: 'different', desc: 'خاروف ➔ حصان' },
                { id: 6, soundA: 28, soundB: 28, type: 'identical', desc: 'خاروف ➔ خاروف' },
                { id: 7, soundA: 32, soundB: 40, type: 'different', desc: 'قطة ➔ اسد' },
                { id: 8, soundA: 32, soundB: 32, type: 'identical', desc: 'قطة ➔ قطة' },
                { id: 9, soundA: 33, soundB: 41, type: 'different', desc: 'كلاب ➔ صيصان' },
                { id: 10, soundA: 41, soundB: 41, type: 'identical', desc: 'صيصان ➔ صيصان' },
                { id: 11, soundA: 34, soundB: 45, type: 'different', desc: 'حمامة ➔ ديك' },
                { id: 12, soundA: 34, soundB: 34, type: 'identical', desc: 'حمامة ➔ حمامة' },
                { id: 13, soundA: 26, soundB: 18, type: 'different', desc: 'ببغاء ➔ غراب' },
                { id: 14, soundA: 26, soundB: 26, type: 'identical', desc: 'ببغاء ➔ ببغاء' },
                { id: 15, soundA: 23, soundB: 27, type: 'different', desc: 'صفارة شرطة ➔ سيارة شرطة' },
                { id: 16, soundA: 27, soundB: 27, type: 'identical', desc: 'سيارة شرطة ➔ سيارة شرطة' },
                { id: 17, soundA: 35, soundB: 47, type: 'different', desc: 'سيارة اطفاء ➔ سيارة اسعاف' },
                { id: 18, soundA: 47, soundB: 47, type: 'identical', desc: 'سيارة اسعاف ➔ سيارة اسعاف' },
                { id: 19, soundA: 49, soundB: 50, type: 'different', desc: 'باخرة ➔ نهر جاري' },
                { id: 20, soundA: 49, soundB: 49, type: 'identical', desc: 'باخرة ➔ باخرة' },
                { id: 21, soundA: 44, soundB: 48, type: 'different', desc: 'مطر ➔ غلي ماء' },
                { id: 22, soundA: 44, soundB: 44, type: 'identical', desc: 'مطر ➔ مطر' },
                { id: 23, soundA: 46, soundB: 43, type: 'different', desc: 'بوسة / قبلة ➔ سعال بنت' },
                { id: 24, soundA: 46, soundB: 46, type: 'identical', desc: 'بوسة / قبلة ➔ بوسة / قبلة' }
            ]
        };

        let currentPhase = 'A';
        let currentIndex = 0;
        let currentTrial = null;
        let audioA = new Audio();
        let audioB = new Audio();
        let isPlayingSequence = false;
        let isVisualHelpActive = false;

        function startPhase(phase) {
            currentPhase = phase;
            currentIndex = 0;
            
            buildTrialModalGrid();

            document.getElementById('home-screen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('game-header').classList.remove('hidden');
                document.getElementById('game-area').classList.remove('hidden');
                document.getElementById('game-area').classList.add('flex');
                
                const titles = { 'A': 'Phase A: Dissimilar Sounds', 'B': 'Phase B: Similar Sounds' };
                document.getElementById('level-title').innerText = titles[phase];
                
                loadTrial();
            }, 300);
        }

        function returnToHome() {
            audioA.pause();
            audioB.pause();
            
            document.getElementById('game-header').classList.add('hidden');
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('flex');
            document.getElementById('home-screen').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('home-screen').classList.remove('opacity-0', 'pointer-events-none');
            }, 50);
        }

        function toggleTrialModal(show) {
            const modal = document.getElementById('trial-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function buildTrialModalGrid() {
            const gridContainer = document.getElementById('trial-modal-grid');
            gridContainer.innerHTML = '';
            
            const phaseTrials = discriminationPhases[currentPhase];
            phaseTrials.forEach((trial, idx) => {
                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center p-3 rounded-2xl border-2 transition cursor-pointer bg-white hover:border-pastel-pink shadow-sm ${currentIndex === idx ? 'border-pastel-pink bg-pastel-pink/10 ring-2 ring-pastel-pink/30' : 'border-gray-100'}`;
                btn.onclick = () => selectTrialFromModal(idx);
                
                btn.innerHTML = `
                    <div class="flex items-center justify-center gap-2 mb-2">
                        <div class="w-10 h-10 bg-gray-50 rounded-xl p-1 border border-gray-100 flex items-center justify-center">
                            <img src="images/${trial.soundA}.png" alt="Sound A" class="w-full h-full object-contain pointer-events-none">
                        </div>
                        <i class="fas fa-arrow-right text-gray-300 text-xs"></i>
                        <div class="w-10 h-10 bg-gray-50 rounded-xl p-1 border border-gray-100 flex items-center justify-center">
                            <img src="images/${trial.soundB}.png" alt="Sound B" class="w-full h-full object-contain pointer-events-none">
                        </div>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Trial ${idx + 1}</span>
                    <span class="text-[10px] text-gray-400 truncate max-w-full">${trial.desc}</span>
                `;
                gridContainer.appendChild(btn);
            });
        }

        function selectTrialFromModal(idx) {
            currentIndex = idx;
            toggleTrialModal(false);
            loadTrial(true);
        }

        function toggleVisualHelp() {
            isVisualHelpActive = !isVisualHelpActive;
            const helpBtn = document.getElementById('help-toggle-btn');
            const visualHints = document.getElementById('visual-hints');
            
            if (isVisualHelpActive) {
                helpBtn.classList.add('bg-pastel-pink', 'text-white');
                visualHints.classList.remove('hidden');
                visualHints.classList.add('flex');
            } else {
                helpBtn.classList.remove('bg-pastel-pink', 'text-white');
                visualHints.classList.remove('flex');
                visualHints.classList.add('hidden');
            }
        }

        function loadTrial(forceIndex = false) {
            const phaseTrials = discriminationPhases[currentPhase];
            
            if (!forceIndex) {
                currentIndex = Math.floor(Math.random() * phaseTrials.length);
            }
            
            currentTrial = phaseTrials[currentIndex];
            
            audioA.src = `sounds/${currentTrial.soundA}.wav`;
            audioB.src = `sounds/${currentTrial.soundB}.wav`;
            
            // Set up hint images
            document.getElementById('hint-img-1').src = `images/${currentTrial.soundA}.png`;
            document.getElementById('hint-img-2').src = `images/${currentTrial.soundB}.png`;
            
            // Re-build modal to update active trial styling if modal is open/reopened
            buildTrialModalGrid();
            
            // Clear any active light-up borders
            document.getElementById('audio-btn-1').classList.remove('border-red-400', 'shadow-lg', 'scale-105');
            document.getElementById('audio-btn-2').classList.remove('border-red-400', 'shadow-lg', 'scale-105');
            document.getElementById('hint-card-1').firstElementChild.classList.remove('border-red-400', 'shadow-md');
            document.getElementById('hint-card-2').firstElementChild.classList.remove('border-red-400', 'shadow-md');
        }

        async function playSingleSound(soundNumber) {
            if (isPlayingSequence) return;
            
            const btn = document.getElementById('audio-btn-' + soundNumber);
            const icon = document.getElementById('icon-' + soundNumber);
            const hintCardBox = document.getElementById('hint-card-' + soundNumber).firstElementChild;
            const targetAudio = soundNumber === 1 ? audioA : audioB;
            
            btn.classList.add('border-red-400', 'shadow-lg', 'scale-105');
            if (isVisualHelpActive) hintCardBox.classList.add('border-red-400', 'shadow-md');
            icon.className = 'fas fa-volume-low text-xl sm:text-2xl md:text-3xl animate-pulse';
            
            targetAudio.currentTime = 0;
            try {
                await targetAudio.play();
                await new Promise((resolve) => {
                    targetAudio.onended = resolve;
                });
            } catch (e) {
                console.log(e);
            } finally {
                btn.classList.remove('border-red-400', 'shadow-lg', 'scale-105');
                if (isVisualHelpActive) hintCardBox.classList.remove('border-red-400', 'shadow-md');
                icon.className = 'fas fa-volume-high text-xl sm:text-2xl md:text-3xl';
            }
        }

        async function playTrialSequence() {
            if (isPlayingSequence) return;
            isPlayingSequence = true;
            
            const btn1 = document.getElementById('audio-btn-1');
            const btn2 = document.getElementById('audio-btn-2');
            const icon1 = document.getElementById('icon-1');
            const icon2 = document.getElementById('icon-2');
            const hintCardBox1 = document.getElementById('hint-card-1').firstElementChild;
            const hintCardBox2 = document.getElementById('hint-card-2').firstElementChild;
            const playAllBtn = document.getElementById('play-all-btn');
            
            playAllBtn.classList.add('opacity-50', 'pointer-events-none');
            
            try {
                // Play Sound 1 to completion naturally
                btn1.classList.add('border-red-400', 'shadow-lg', 'scale-105');
                if (isVisualHelpActive) hintCardBox1.classList.add('border-red-400', 'shadow-md');
                icon1.className = 'fas fa-volume-low text-xl sm:text-2xl md:text-3xl animate-pulse';
                
                audioA.currentTime = 0;
                await audioA.play();
                
                await new Promise((resolve) => {
                    audioA.onended = resolve;
                });
                
                // Turn off Sound 1 light, wait 1 second
                btn1.classList.remove('border-red-400', 'shadow-lg', 'scale-105');
                if (isVisualHelpActive) hintCardBox1.classList.remove('border-red-400', 'shadow-md');
                icon1.className = 'fas fa-volume-high text-xl sm:text-2xl md:text-3xl';
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Play Sound 2 to completion naturally
                btn2.classList.add('border-red-400', 'shadow-lg', 'scale-105');
                if (isVisualHelpActive) hintCardBox2.classList.add('border-red-400', 'shadow-md');
                icon2.className = 'fas fa-volume-low text-xl sm:text-2xl md:text-3xl animate-pulse';
                
                audioB.currentTime = 0;
                await audioB.play();
                
                await new Promise((resolve) => {
                    audioB.onended = resolve;
                });
                
                // Turn off Sound 2 light
                btn2.classList.remove('border-red-400', 'shadow-lg', 'scale-105');
                if (isVisualHelpActive) hintCardBox2.classList.remove('border-red-400', 'shadow-md');
                icon2.className = 'fas fa-volume-high text-xl sm:text-2xl md:text-3xl';
                
            } catch (e) {
                console.log(e);
            } finally {
                btn1.classList.remove('border-red-400', 'shadow-lg', 'scale-105');
                btn2.classList.remove('border-red-400', 'shadow-lg', 'scale-105');
                if (isVisualHelpActive) {
                    hintCardBox1.classList.remove('border-red-400', 'shadow-md');
                    hintCardBox2.classList.remove('border-red-400', 'shadow-md');
                }
                icon1.className = 'fas fa-volume-high text-xl sm:text-2xl md:text-3xl';
                icon2.className = 'fas fa-volume-high text-xl sm:text-2xl md:text-3xl';
                playAllBtn.classList.remove('opacity-50', 'pointer-events-none');
                isPlayingSequence = false;
            }
        }

        function handleAnswer(userChoice) {
            const fbModal = document.getElementById('central-feedback');
            const fbIcon = document.getElementById('feedback-icon-big');
            
            fbModal.classList.remove('hidden');
            
            if (userChoice === currentTrial.type) {
                fbIcon.className = 'fas fa-check-circle text-green-500 animate-pop';
                document.getElementById('sound-success').play().catch(e => console.log(e));
                setTimeout(() => loadTrial(false), 1200);
            } else {
                fbIcon.className = 'fas fa-times-circle text-red-500 animate-pop';
            }
            
            setTimeout(() => { 
                fbModal.classList.add('hidden'); 
            }, 1000);
        }
    </script>
</body>
</html>
