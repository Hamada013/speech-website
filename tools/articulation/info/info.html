<body class="min-h-screen flex flex-col bg-gradient-to-br from-pink-50 to-blue-50">

                <p class="text-slate-400 font-medium max-w-md mx-auto leading-relaxed" data-translate="ipa_note">استكشف مخارج الحروف باستخدام الأبجدية الصوتية الدولية</p>
            </div>

            <!-- Category Tabs -->
            <div class="flex justify-center w-full">
                <div class="bg-white/60 p-1.5 rounded-full shadow-sm border border-white inline-flex flex-wrap justify-center gap-1">

            </div>
        </div>

                            /b/

                        </div>
                    </div>

                    <div class="flex-grow overflow-y-auto custom-scrollbar pr-2">

        </div>

            ar: {
                select_sound: "اختر صوتاً",
                ipa_note: "استكشف مخارج الحروف باستخدام الأبجدية الصوتية الدولية",
                back_menu: "القائمة",
                dir: "rtl",
                cat_cons: "صوامت",
                cat_vow: "صوائت",
                cat_clus: "عناقيد",
                label_visual: "المعين البصري",
                label_guide: "دليل النطق",
                label_production: "كيفية النطق:",
                label_example: "مثال",
                btn_listen: "استمع",
                font: "Tajawal"
            }
        };

        // --- STATE & UTILS ---

        Object.assign(translations.en, {"ui_0": "Articulation - Info & Elicitation", "ui_1": "Therapy Assistant", "ui_2": "Consonants", "ui_3": "Vowels", "ui_4": "Clusters", "ui_5": "Navigation", "ui_6": "&copy; 2023 Articulation Assistant", "close_label": "Close"});
        Object.assign(translations.ar, {"ui_0": "النطق — مخارج الأصوات", "ui_1": "مساعد التدريب على النطق", "ui_2": "صوامت", "ui_3": "صوائت", "ui_4": "عناقيد", "ui_5": "التنقل", "ui_6": "© 2023 مساعد النطق", "close_label": "إغلاق"});

        Object.assign(translations.en, {"extra_0": "Articulation"});
        Object.assign(translations.ar, {"extra_0": "النطق"});
        let state = {
            lang: 'ar',
            currentCategory: 'consonants',
            currentList: [],
            currentIndex: 0
        };

        function setHTMLDir(dir) {
            document.documentElement.dir = dir;
            document.documentElement.lang = state.lang;

            // Adjust layouts based on direction
            if(dir === 'rtl') {
                document.querySelectorAll('.fa-chevron-right').forEach(el => el.style.transform = "rotate(180deg)");
                document.querySelectorAll('.fa-chevron-left').forEach(el => el.style.transform = "rotate(180deg)");
                document.querySelectorAll('.fa-arrow-left').forEach(el => el.style.transform = "rotate(180deg)");
            } else {
                document.querySelectorAll('.fa-chevron-right').forEach(el => el.style.transform = "");
                document.querySelectorAll('.fa-chevron-left').forEach(el => el.style.transform = "");
                document.querySelectorAll('.fa-arrow-left').forEach(el => el.style.transform = "");
            }
        }

        // --- CORE FUNCTIONS ---

        function toggleLanguage() {
            state.lang = state.lang === 'en' ? 'ar' : 'en';
            state.currentCategory = 'consonants'; // Reset category on lang switch
            updateLanguageUI();

            // Re-render grid if visible
            if(!document.getElementById('selection-view').classList.contains('hidden')) {
                renderSelectionGrid();
            } else {
                // If in detail view, try to find equivalent sound or go back to menu?
                // For simplicity, go back to menu
                showSelectionView();
            }
        }

        function updateLanguageUI() {
            const t = translations[state.lang];

            // Header Button
            document.getElementById('lang-text').innerText = state.lang === 'en' ? 'عربي' : 'English';

            // HTML Dir
            setHTMLDir(t.dir);

            // Toggle cluster button visibility (Hide for Arabic as data is empty)
            const clusterBtn = document.getElementById('cluster-btn');
            if (state.lang === 'ar') clusterBtn.style.display = 'none';
            else clusterBtn.style.display = 'block';

            // Translate Static elements
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if(t[key]) el.innerText = t[key];
            });

            // Update Tabs Styling
            updateActiveTabUI();
        }

        function filterCategory(cat) {
            state.currentCategory = cat;
            updateActiveTabUI();
            renderSelectionGrid();
        }

        function updateActiveTabUI() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                // Reset styles
                btn.classList.remove('bg-pastel-blue', 'text-white', 'shadow-md', 'scale-105');
                btn.classList.add('text-slate-500', 'hover:bg-gray-50');

                // Set Active
                if(btn.dataset.category === state.currentCategory) {
                    btn.classList.remove('text-slate-500', 'hover:bg-gray-50');
                    btn.classList.add('bg-pastel-blue', 'text-white', 'shadow-md', 'scale-105');
                }
            });
        }

        function renderSelectionGrid() {
            const grid = document.getElementById('sound-grid');
            grid.innerHTML = '';

            // Get Data
            const list = soundData[state.lang][state.currentCategory] || [];
            state.currentList = list;

            list.forEach((sound, index) => {
                const btn = document.createElement('button');
                // Card Styling
                btn.className = "group relative aspect-square bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 flex flex-col items-center justify-center overflow-hidden";

                btn.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-br from-white to-slate-50 opacity-0 group-hover:opacity-100 transition duration-300"></div>
                    <span class="text-3xl font-bold ipa-font text-slate-600 group-hover:text-pastel-blueDark relative z-10">${sound.ipa}</span>
                    <span class="text-[10px] uppercase tracking-wide text-slate-300 group-hover:text-pastel-blue relative z-10 mt-1 font-bold">${sound.example || ''}</span>
                    <div class="absolute bottom-0 h-1 w-full bg-pastel-blue transform scale-x-0 group-hover:scale-x-100 transition duration-300"></div>
                `;

                btn.onclick = () => selectSound(index);
                grid.appendChild(btn);
            });
        }

        // --- NAVIGATION & DETAIL VIEW ---

        function selectSound(index) {
            state.currentIndex = index;

            // Animation for View Switch
            const selectionView = document.getElementById('selection-view');
            const detailView = document.getElementById('detail-view');
            const homeBtn = document.getElementById('home-btn');

            selectionView.classList.add('hidden');
            detailView.classList.remove('hidden');
            detailView.classList.add('flex');
            homeBtn.classList.remove('hidden');
            homeBtn.classList.add('flex');

            // Scroll to top
            window.scrollTo(0,0);

            renderDetail();
        }

        function showSelectionView() {
            const selectionView = document.getElementById('selection-view');
            const detailView = document.getElementById('detail-view');
            const homeBtn = document.getElementById('home-btn');

            detailView.classList.add('hidden');
            detailView.classList.remove('flex');
            selectionView.classList.remove('hidden');
            homeBtn.classList.add('hidden');
            homeBtn.classList.remove('flex');
        }

        function renderDetail() {
            const sound = state.currentList[state.currentIndex];

            // 1. Update Text Content
            document.getElementById('current-ipa-display').innerText = `/${sound.ipa}/`;
            document.getElementById('detail-text').innerText = sound.info;
            document.getElementById('example-word').innerText = sound.example;

            // 2. Update Image Logic (Try to load image, fallback to card if fail)
            const imgEl = document.getElementById('detail-image');
            const fallbackCard = document.getElementById('fallback-card');
            const bigIpa = document.getElementById('big-ipa');

            // Set content for fallback
            bigIpa.innerText = `/${sound.ipa}/`;

            // Since we don't have real images in this portable version,
            // we will default to the nice typographic card.
            // However, I've kept the logic if you add images later.
            // For now, I'll force fallback to show the design.

            /* To use images:
               imgEl.src = `../images/${state.lang}/${sound.id}.png`;
               imgEl.classList.remove('hidden');
               fallbackCard.classList.add('hidden');
            */

            // Using pure CSS/HTML fallback for self-contained file:
            imgEl.src = "";
            imgEl.classList.add('hidden');
            fallbackCard.classList.remove('hidden');
            fallbackCard.classList.add('flex');

            // 3. Update Counter
            document.getElementById('counter-display').innerText = `${state.currentIndex + 1} / ${state.currentList.length}`;
        }

        function nextSound() {
            if (state.currentIndex < state.currentList.length - 1) {
                state.currentIndex++;
            } else {
                state.currentIndex = 0; // Loop
            }
            renderDetail();
        }

        function prevSound() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
            } else {
                state.currentIndex = state.currentList.length - 1; // Loop
            }
            renderDetail();
        }

        // --- AUDIO ---

        function playAudio() {
            const sound = state.currentList[state.currentIndex];
            if(!sound || !sound.example) return;

            // Stop any current speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(sound.example);

            // Set Language
            utterance.lang = state.lang === 'ar' ? 'ar-SA' : 'en-US';
            utterance.rate = 0.9; // Slightly slower for clarity

            window.speechSynthesis.speak(utterance);
        }

        // --- INIT ---
        // Pre-load logic
        updateLanguageUI();
        filterCategory('consonants');

    </script>
</body>
</html>
