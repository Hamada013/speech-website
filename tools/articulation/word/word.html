<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="ui_0">النطق — الكلمات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            pink: '#FAD2E1',
                            blue: '#C5D0E6',
                            green: '#C1E1C1',
                            yellow: '#FDFD96',
                            purple: '#E6E6FA',
                            text: '#4A5568'
                        }
                    },
                    fontFamily: {
                        sans: ['Varela Round', 'Tajawal', 'sans-serif'],
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-5px)' },
                            '75%': { transform: 'translateX(5px)' }
                        }
                    },
                    animation: {
                        shake: 'shake 0.3s ease-in-out'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFF5F7;
            font-family: 'Varela Round', 'Tajawal', sans-serif;
            color: #4A5568;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .star-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* Card Styles */
        .card-controls {
            transition: all 0.3s ease;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .card-controls.visible {
            max-height: 100px;
            opacity: 1;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px dashed #eee;
        }

        .edit-btn-active {
            background-color: #FAD2E1 !important;
            color: #D53F8C !important;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .glow-target {
            box-shadow: 0 0 20px 8px rgba(66, 153, 225, 0.6) !important;
            border-color: #4299E1 !important;
            transform: scale(1.02);
            z-index: 10;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }

        .modal-overlay {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }

        .hidden-section { display: none !important; }

        #side-panel { transition: all 0.3s ease; }
        #side-panel.collapsed { width: 0; padding: 0; overflow: hidden; }

        /* Filter Tab Styles */
        .filter-tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: #f0f0f0;
            color: #888;
        }
        .filter-tab.active {
            background: #C5D0E6; /* pastel-blue */
            color: #4A5568;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
</head>
<body class="min-h-screen flex flex-col" onload="init()">

    <canvas id="fireworks-canvas"></canvas>

    <!-- Header -->
    <header class="bg-white shadow-sm p-3 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="showParentInfo()" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-pastel-blue text-pastel-text transition flex items-center justify-center">
                    <i class="fas fa-info-circle text-lg"></i>
                </button>
                <button onclick="window.location.href='../artic.html'" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-pastel-pink text-pastel-text transition flex items-center justify-center shadow-sm">
                    <i class="fas fa-home text-lg"></i>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <div class="h-8 w-8 rounded-xl overflow-hidden">
                    <img src="../assets/logo.webp" alt="Articulation — Hamada" class="w-full h-full object-contain">
                </div>
                <h1 class="font-bold text-lg text-pastel-text" data-translate="ui_1">النطق — الكلمات</h1>
            </div>

            <button id="lang-btn" onclick="toggleLanguage()" class="bg-pastel-blue/50 text-slate-700 px-4 py-1.5 rounded-full text-sm font-bold hover:bg-pastel-blue transition">
                عربي
            </button>
        </div>
    </header>

    <!-- WORKPLACE (Default View) -->
    <section id="workplace" class="flex-grow flex flex-col relative h-[calc(100vh-64px)]">

        <!-- Stars Bar -->
        <div id="star-panel-container" class="bg-white border-b border-gray-100 p-2 transition-all duration-300 z-30 shadow-sm relative">
            <div class="container mx-auto flex flex-col items-center">
                <button onclick="toggleStarPanel()" class="absolute right-4 top-2 text-gray-300 hover:text-gray-500"><i class="fas fa-chevron-up"></i></button>
                <div class="flex gap-1 md:gap-3 justify-center flex-wrap" id="star-slots">
                    <!-- Stars -->
                </div>
            </div>
        </div>

        <div class="flex flex-grow overflow-hidden relative">

            <!-- Sidebar -->
            <aside id="side-panel" class="bg-white w-16 md:w-20 shadow-[2px_0_10px_rgba(0,0,0,0.05)] flex flex-col items-center py-4 gap-4 z-20 overflow-y-auto shrink-0 border-r border-gray-50">

                <button onclick="toggleStarPanel()" class="p-3 rounded-xl hover:bg-gray-50 text-pastel-text transition" title="إظهار أو إخفاء النجوم">
                    <i class="fas fa-star text-yellow-400 text-lg"></i>
                </button>

                <button onclick="openModal('template-modal')" class="p-3 rounded-xl hover:bg-pastel-blue text-pastel-text transition" title="قوالب البطاقات">
                    <i class="fas fa-th text-lg"></i>
                </button>

                <button id="edit-mode-btn" onclick="toggleEditMode()" class="p-3 rounded-xl hover:bg-gray-100 text-pastel-text transition relative" title="تعديل البطاقات">
                    <i class="fas fa-pen text-lg"></i>
                </button>

                <div class="h-px w-8 bg-gray-200 my-1"></div>

                <button onclick="showModeSelect('test')" class="p-3 rounded-xl hover:bg-pastel-green text-pastel-text transition flex flex-col items-center gap-1" title="اختبار">
                    <i class="fas fa-check-circle text-lg"></i>
                    <span class="text-[9px] font-bold" data-translate="ui_2">اختبار</span>
                </button>

                <button onclick="showModeSelect('practice')" class="p-3 rounded-xl hover:bg-pastel-yellow text-pastel-text transition flex flex-col items-center gap-1" title="تدريب">
                    <i class="fas fa-graduation-cap text-lg"></i>
                    <span class="text-[9px] font-bold" data-translate="ui_3">تدريب</span>
                </button>

                <button onclick="shuffleSlots()" class="p-3 rounded-xl hover:bg-pastel-purple text-pastel-text transition mt-auto" title="خلط البطاقات">
                    <i class="fas fa-random text-lg"></i>
                </button>

                <button onclick="clearSlots()" class="p-3 rounded-xl hover:bg-red-50 text-red-400 transition mb-2" title="مسح الكل">
                    <i class="fas fa-trash-alt text-lg"></i>
                </button>
            </aside>

            <!-- Canvas/Main Area -->
            <main class="flex-grow bg-pastel-pink/10 p-4 relative overflow-y-auto flex flex-col w-full">

                <button onclick="toggleSidePanel()" class="absolute top-4 left-4 z-10 bg-white p-2.5 rounded-full shadow hover:bg-gray-50 text-gray-400">
                    <i class="fas fa-bars"></i>
                </button>

                <div class="flex-grow flex items-center justify-center p-2 pb-20">
                    <div id="slots-container" class="grid gap-4 w-full max-w-6xl mx-auto transition-all duration-300">
                        <!-- Dynamic Slots -->
                    </div>
                </div>
            </main>
        </div>
    </section>

    <!-- MODALS -->

    <!-- Template Selection Modal -->
    <div id="template-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center animate-fade-in">
            <h3 class="text-xl font-bold text-pastel-text mb-6" data-translate="ui_4">كم بطاقة؟</h3>
            <div class="flex justify-center gap-3 flex-wrap">
                <button onclick="setTemplate(1)" class="w-12 h-12 rounded-xl bg-pastel-blue hover:scale-110 transition font-bold text-slate-600 shadow-sm">1</button>
                <button onclick="setTemplate(2)" class="w-12 h-12 rounded-xl bg-pastel-pink hover:scale-110 transition font-bold text-slate-600 shadow-sm">2</button>
                <button onclick="setTemplate(3)" class="w-12 h-12 rounded-xl bg-pastel-green hover:scale-110 transition font-bold text-slate-600 shadow-sm">3</button>
                <button onclick="setTemplate(4)" class="w-12 h-12 rounded-xl bg-pastel-yellow hover:scale-110 transition font-bold text-slate-600 shadow-sm">4</button>
                <button onclick="setTemplate(5)" class="w-12 h-12 rounded-xl bg-pastel-purple hover:scale-110 transition font-bold text-slate-600 shadow-sm">5</button>
            </div>
            <button onclick="closeModal('template-modal')" class="mt-8 text-gray-400 hover:text-gray-600" data-translate="ui_5">إلغاء</button>
        </div>
    </div>

    <!-- Letter Selection Modal -->
    <div id="letter-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-4xl w-full mx-4 h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-pastel-text" data-translate="select_letter">اختر صوتاً</h3>
                <button onclick="closeModal('letter-modal')" class="text-gray-400 hover:text-red-400">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Categories -->
            <div class="flex justify-center gap-2 mb-4" id="letter-categories">
                <button onclick="setLetterFilter('consonants')" class="filter-tab active" data-filter="consonants" data-translate="extra_0">صوامت</button>
                <button onclick="setLetterFilter('vowels')" class="filter-tab" data-filter="vowels" data-translate="ui_6">صوائت</button>
                <button onclick="setLetterFilter('clusters')" class="filter-tab" data-filter="clusters" data-translate="ui_7">عناقيد</button>
            </div>

            <div id="letter-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-7 gap-3 overflow-y-auto p-2 flex-grow">
                <!-- Letters -->
            </div>
        </div>
    </div>

    <!-- Position Selector Modal -->
    <div id="position-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-md w-full mx-4 text-center">
             <h3 class="font-bold text-xl mb-6 text-pastel-text" data-translate="ui_8">موضع الصوت في الكلمة</h3>
             <div id="position-btn-container" class="grid grid-cols-3 gap-3">
                <button id="pos-first-btn" onclick="selectPosition('first')" class="p-4 bg-blue-50 rounded-xl hover:bg-blue-100 font-bold text-slate-600 border-2 border-transparent hover:border-blue-200 transition" data-translate="extra_1">أول الكلمة</button>
                <button id="pos-middle-btn" onclick="selectPosition('middle')" class="p-4 bg-green-50 rounded-xl hover:bg-green-100 font-bold text-slate-600 border-2 border-transparent hover:border-green-200 transition" data-translate="ui_9">وسط الكلمة</button>
                <button id="pos-last-btn" onclick="selectPosition('last')" class="p-4 bg-pink-50 rounded-xl hover:bg-pink-100 font-bold text-slate-600 border-2 border-transparent hover:border-pink-200 transition" data-translate="ui_10">آخر الكلمة</button>
             </div>
             <button onclick="closeModal('position-modal'); openModal('letter-modal')" class="mt-6 text-gray-400 hover:text-gray-600" data-translate="ui_11">رجوع</button>
        </div>
    </div>

    <!-- Image Grid Modal -->
    <div id="image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-5xl w-full mx-4 h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-pastel-text" data-translate="extra_2">اختر كلمة</h3>
                <button onclick="closeModal('image-modal')" class="text-gray-400 hover:text-red-400">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="image-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4 overflow-y-auto p-2 flex-grow">
                <!-- Images -->
            </div>
        </div>
    </div>

    <!-- Mode Selection Modal -->
    <div id="mode-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center animate-fade-in">
            <h3 class="text-xl font-bold mb-6" id="mode-title" data-translate="ui_12">اختر عدد الجولات</h3>
            <div class="flex gap-4 justify-center">
                <button onclick="startMode(5)" class="bg-pastel-blue hover:bg-blue-300 w-20 h-20 rounded-2xl font-bold text-2xl shadow-lg transition transform hover:scale-105 flex flex-col items-center justify-center text-slate-600">
                    <span>5</span>
                    <span class="text-xs font-normal" data-translate="ui_13">جولات</span>
                </button>
                <button onclick="startMode(10)" class="bg-pastel-pink hover:bg-pink-300 w-20 h-20 rounded-2xl font-bold text-2xl shadow-lg transition transform hover:scale-105 flex flex-col items-center justify-center text-slate-600">
                    <span>10</span>
                    <span class="text-xs font-normal" data-translate="ui_14">جولات</span>
                </button>
            </div>
            <button onclick="closeModal('mode-modal')" class="mt-8 text-gray-400" data-translate="ui_15">إلغاء</button>
        </div>
    </div>

    <!-- Generic Info Modal -->
    <div id="info-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-2xl w-full mx-4 relative max-h-[90vh] flex flex-col">
            <button onclick="closeModal('info-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-red-400">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 id="modal-title" class="text-2xl font-bold text-pastel-text mb-4 text-center" data-translate="ui_16">معلومات</h3>
            <div id="modal-content" class="text-gray-600 leading-relaxed overflow-y-auto p-2"></div>
        </div>
    </div>

        // --- FIREWORKS ---
        function launchFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#FAD2E1', '#C5D0E6', '#C1E1C1', '#FDFD96', '#E6E6FA'];

            function createExplosion(x, y) {
                for(let i=0; i<60; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        decay: Math.random() * 0.02 + 0.01
                    });
                }
            }

            createExplosion(canvas.width/2, canvas.height/2);
            setTimeout(() => createExplosion(canvas.width/3, canvas.height/3), 300);
            setTimeout(() => createExplosion(2*canvas.width/3, canvas.height/2), 600);

            function animate() {
                if (particles.length === 0) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                requestAnimationFrame(animate);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15; // Gravity
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    } else {
                        ctx.globalAlpha = p.alpha;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }
            animate();
        }

        // --- AUDIO PLAYBACK & RECORDING ---

        function playSlotAudio(index) {
            const slot = state.slotsData[index];
            if(!slot) return;

            if(slot.customAudio) {
                const audio = new Audio(slot.customAudio);
                audio.play().catch(e=>console.log(e));
                return;
            }

            const path = `sounds/${state.lang}/${slot.letterId}/${slot.pos}/${slot.imgId}.wav`;
            const audio = new Audio(path);
            audio.play().catch(e => {
                console.log("Audio not found: ", path);
                // Fallback to TTS if wav missing
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(slot.label);
                    u.lang = state.lang === 'ar' ? 'ar-SA' : 'en-US';
                    window.speechSynthesis.speak(u);
                }
            });
        }

        function recordAudio(index) {
            const slot = state.slotsData[index];
            if(!slot) return;
            const dot = document.getElementById(`rec-dot-${index}`);

            dot.classList.remove('hidden');

            // Mock recording delay
            setTimeout(() => {
                dot.classList.add('hidden');
                // Mock setting a blob URL for demo
                slot.customAudio = 'https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3';
                renderSlots();
            }, 2000);
        }

        function playRecording(index) {
            const slot = state.slotsData[index];
            if(slot && slot.customAudio) {
                new Audio(slot.customAudio).play();
            }
        }

        // --- GAME MODES ---

        function showModeSelect(mode) {
            state.pendingMode = mode;
            document.getElementById('mode-title').innerText = state.lang === 'ar' ? (mode === 'test' ? 'وضع الاختبار' : 'وضع التدريب') : (mode === 'test' ? 'Test Mode' : 'Practice Mode');
            openModal('mode-modal');
        }

        function startMode(rounds) {
            state.mode = state.pendingMode;
            state.rounds = rounds;
            state.currentRound = 0;
            closeModal('mode-modal');
            if(state.editMode) toggleEditMode();
            nextRound();
        }

        function nextRound() {
            if(state.currentRound >= state.rounds) {
                endMode();
                return;
            }
            state.currentRound++;
            const filledIndexes = [];
            state.slotsData.forEach((s, i) => { if(s) filledIndexes.push(i); });

            if(filledIndexes.length === 0) {
                endMode();
                return;
            }

            state.targetSlotIndex = filledIndexes[Math.floor(Math.random() * filledIndexes.length)];
            renderSlots();
            setTimeout(() => {
                playSlotAudio(state.targetSlotIndex);
            }, 500);
        }

        function handleGameClick(index, divElement) {
            if (index === state.targetSlotIndex) {
                document.getElementById('sound-success').play();
                divElement.classList.add('bg-green-100', 'border-4', 'border-green-400');
                toggleStar(state.stars); // reward
                setTimeout(() => nextRound(), 1000);
            } else {
                divElement.classList.add('bg-red-100', 'animate-shake');
                setTimeout(() => divElement.classList.remove('bg-red-100', 'animate-shake'), 500);
            }
        }

        function endMode() {
            state.mode = 'free';
            state.targetSlotIndex = null;
            renderSlots();
        }

    </script>
</body>
</html>
