<!doctype html><html lang="ar" dir="rtl"><head><base target="_top"><style>body{font:14px system-ui;color:#22445a;padding:16px;background:#f8fafc}h2{font-size:20px}label{display:block;border:1px dashed #a6c6d7;border-radius:18px;padding:20px;background:white}input{max-width:100%;margin-top:12px}button{width:100%;padding:12px;margin-top:18px;border:1px solid #a6c6d7;border-radius:14px;background:#e9f5ee;font:inherit;color:inherit}#status{white-space:pre-wrap}</style></head><body><h2>إضافة حالة إلى البحث</h2><p>اختر ملف المشاركة الذي نزّلته من التطبيق. الفحوصات الموجودة تُحدّث بمعرّفاتها، دون تكرار الصفوف.</p><label>ملف الحالة<input id="file" type="file" accept="application/json,.json"></label><button id="import" onclick="importCase()">استيراد / تحديث</button><p id="status" role="status"></p><script>
async function importCase(){const file=document.getElementById('file').files[0],status=document.getElementById('status'),button=document.getElementById('import');if(!file){status.textContent='اختر ملف الحالة أولاً.';return;}button.disabled=true;status.textContent='جارٍ التحقق والتحديث…';try{const text=await file.text();google.script.run.withSuccessHandler(result=>{button.disabled=false;status.textContent='تم تحديث '+result.assessments+' فحص و'+result.findings+' بند. النتائج والرسوم مرتبطة بالبيانات.';}).withFailureHandler(error=>{button.disabled=false;status.textContent=error.message;}).importResearchJSON(text);}catch{button.disabled=false;status.textContent='تعذر قراءة الملف.';}}
</script></body></html>
