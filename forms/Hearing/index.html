<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hearing Loss Forms | Ahmad Ghanem SLP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap">
  <!-- Tab Icon -->
  <link rel="icon" href="../images/logo.png" type="image/png">
  <style>
    body {
      font-family: 'Segoe UI', Arial, 'Noto Sans Arabic', sans-serif;
      background: #f8fafd;
      margin: 0;
      color: #233;
    }

    .site-nav-bar {
      margin-bottom: 1.7em;
      text-align: center;
      width: 100%;
      background: #fcfdff;
      border-bottom: 1px solid #e3f1ff;
      padding: 0.45em 0;
    }

    .site-nav-bar a {
      color: #43a6f8;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 1em;
      margin: 0 0.5em;
      transition: background 0.13s;
    }

    .site-nav-bar a.active,
    .site-nav-bar a:hover {
      background: #e0f2ff;
      color: #2693d9;
    }

    .forms-header {
      margin-top: 2em;
      margin-bottom: 2.5em;
      text-align: center;
      padding: 0 1em;
    }

    .subtitle {
      font-size: 1.11em;
      color: #3496d8;
      margin-bottom: 0.5em;
      font-weight: bold;
    }

    .forms-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5em;
      max-width: 1200px;
      margin: 0 auto 3em;
      padding: 0 1em;
    }

    .form-card {
      background: #fcfdff;
      border-radius: 16px;
      border: 1.8px solid #e3f1ff;
      box-shadow: 0 3px 14px #a4d4ff16;
      padding: 25px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: box-shadow 0.17s, border-color 0.17s;
      min-height: 280px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .form-card:hover {
      box-shadow: 0 8px 32px #43a6f830;
      border-color: #43a6f8;
    }

    .form-card img {
      width: 70px;
      height: 70px;
      margin-bottom: 0.9em;
      object-fit: contain;
      filter: drop-shadow(0 2px 12px #43a6f814);
    }

    .form-card-title {
      font-size: 1.16em;
      font-weight: bold;
      color: #233;
      margin: 0.5em 0;
    }

    .form-card-desc {
      color: #6b7689;
      font-size: 0.95em;
      margin: 0.5em 0 1.2em;
      flex-grow: 1;
    }

    .about-contact {
      margin-top: 2.5em;
      font-size: 1.05em;
      line-height: 1.7;
      color: #3e4666;
      text-align: center;
    }

    .about-contact a {
      color: #3496d8;
      text-decoration: none;
    }

    @media (max-width: 1024px) {
      .form-card img { width: 60px; height: 60px; }
      .form-card { min-height: 250px; padding: 20px 15px; }
    }

    @media (max-width: 768px) {
      .forms-list {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1em;
      }
      .form-card img { width: 55px; height: 55px; }
      .form-card { min-height: 220px; padding: 18px 12px; }
    }

    @media (max-width: 480px) {
      .forms-list { grid-template-columns: 1fr; gap: 0.9em; }
      .form-card img { width: 50px; height: 50px; margin-bottom: 0.7em; }
      .form-card-title { font-size: 1.05em; }
      .form-card-desc { font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <nav class="site-nav-bar">
    <a href="../../index.html">Home</a>
    <a href="../../tools.html">Tools</a>
    <a href="../../resources.html">Resources</a>
  </nav>

  <main>
    <div class="forms-header">
      <h1>Hearing Loss Forms</h1>
      <div class="subtitle">All digital assessment and intake forms</div>
    </div>

    <div class="forms-list">
      <a href="ling_test/index.html" target="_blank" rel="noopener" class="form-card">
        <img src="../../images/ling.gif" alt="Oral Motor Exam icon">
        <div class="form-card-title">Ling Six Sounds</div>
        <div class="form-card-desc">Hearing Speech Sound Test</div>
      </a>

      <a href="Auditory Skills Checklist/index.html" target="_blank" rel="noopener" class="form-card">
        <img src="../../images/srv.gif" alt="Child icon">
        <div class="form-card-title">Auditory Skills Checklist</div>
        <div class="form-card-desc">Med-El Checklist</div>
      </a>
    </div>

    <div class="about-contact">
      <strong>Questions?</strong>
      <a href="mailto:slp.ahmadghanem@gmail.com">slp.ahmadghanem@gmail.com</a> &bull;
      <a href="tel:+963988451245">+963 988 451 245</a>
    </div>
  </main>
</body>
</html>
