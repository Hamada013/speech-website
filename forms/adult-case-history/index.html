<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adult Case History</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;700&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* --- CSS VARIABLES --- */
    :root {
      --primary: #2563eb;       /* Professional Blue */
      --primary-dark: #1e40af;
      --primary-light: #dbeafe;
      --bg-page: #f1f5f9;
      --surface: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --danger: #ef4444;
      --warning-bg: #fef2f2;
      --warning-border: #fecaca;
      --success: #10b981;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    body {
      font-family: 'Segoe UI', Arial, 'Noto Sans Arabic', sans-serif;
      background: var(--bg-page);
      color: var(--text);
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* --- LAYOUT --- */
    main {
      max-width: 950px;
      margin: 2rem auto;
      padding: 2.5rem;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    /* Header */
    .header-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2.5rem;
        text-align: center;
    }

    h1 {
      color: var(--primary);
      margin: 0 0 0.2em 0;
      font-size: 2.4em;
    }

    .subtitle {
      color: var(--text-light);
      font-size: 1em;
      font-weight: 500;
    }

    /* --- SECTIONS --- */
    section {
      margin: 2em 0;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .section-head {
      padding: 1em 1.5em;
      font-size: 1.2em;
      font-weight: 700;
      background: #f8fafc;
      color: var(--text);
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
    }
    .section-head::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 1.2em;
      background: var(--primary);
      margin-inline-end: 12px;
      border-radius: 4px;
    }

    .section-content { padding: 1.5rem; }

    .subsection-title {
        color: var(--primary-dark);
        font-weight: 700;
        margin-top: 1.5rem;
        margin-bottom: 0.8rem;
        font-size: 1.05rem;
        border-bottom: 1px dashed #cbd5e1;
        padding-bottom: 5px;
    }

    /* --- FORM ELEMENTS --- */
    .row-flex { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 15px; }
    .col2 { flex: 1 1 350px; }
    .col3 { flex: 1 1 200px; }

    label {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4em;
      display: block;
      font-size: 0.95em;
      margin-top: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 0.95em;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    textarea { min-height: 80px; resize: vertical; }

    /* --- CHECKBOX GRID --- */
    .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 10px;
    }
    .checkbox-item {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.95em;
    }
    .checkbox-item:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .checkbox-item.checked {
        background: var(--primary-light);
        border-color: var(--primary);
        color: var(--primary-dark);
        font-weight: 600;
    }
    .checkbox-item input { width: auto; margin: 0; }

    /* --- PILLS --- */
    .pills-box { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .pill {
      background: #fff;
      border: 1px solid #cbd5e1;
      color: var(--text);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill:hover { border-color: var(--primary); background: #f8fafc; }
    .pill.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* --- TOGGLE SWITCH --- */
    .toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1em;
      margin: 1.5rem 0;
      padding: 6px 16px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 50px;
      width: fit-content;
    }
    .toggle-switch { position: relative; width: 44px; height: 24px; }
    .toggle-switch input { display: none; }
    .slider {
      cursor: pointer; position: absolute; inset: 0;
      background: #cbd5e1; border-radius: 34px; transition: 0.3s;
    }
    .slider:before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s;
    }
    input:checked + .slider { background: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }
    
    .lang-label { font-weight: bold; font-size: 0.9em; color: var(--text-light); cursor: pointer; }
    .lang-label.active { color: var(--primary); }

    /* --- BUTTONS --- */
    .actions {
      display: flex; justify-content: center; gap: 15px; margin-top: 40px; padding-top: 20px; border-top: 2px dashed #e2e8f0;
    }
    .btn {
      background: var(--primary); color: #fff; border: none;
      padding: 10px 24px; border-radius: 6px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; font-size: 1rem;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-magic { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); width: 100%; justify-content: center; margin-bottom: 15px;}

    /* --- FOOTER --- */
    .slp-footer {
        text-align: center; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;
        color: var(--text-light); font-size: 0.85em;
    }

    /* --- RTL --- */
    html[dir="rtl"] { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; }
    html[dir="rtl"] .section-head::before { margin-inline-end: 0; margin-inline-start: 12px; }
    html[dir="rtl"] input:checked + .slider:before { transform: translateX(-20px); }

    /* --- PRINT --- */
    #print-report-container { display: none; }
    @media print {
      body { background: white; font-size: 11pt; font-family: 'Times New Roman', serif; color: black; }
      main { display: none; }
      #print-report-container { display: block; width: 100%; }
      .print-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
      .print-header h1 { font-size: 18pt; margin: 0; color: #000; }
      .print-section { margin-bottom: 20px; page-break-inside: avoid; }
      .print-section h3 { background: #eee; padding: 5px; border-bottom: 1px solid #000; font-size: 12pt; text-transform: uppercase; margin: 0 0 10px 0; }
      .print-row { display: flex; margin-bottom: 6px; }
      .print-label { font-weight: bold; width: 180px; flex-shrink: 0; }
      .print-value { flex-grow: 1; }
      .print-footer { position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #000; padding-top: 5px; text-align: center; font-size: 9pt; }
    }
  </style>
</head>

    let lang = "en";
    let res = translations[lang];

    /* --- HELPERS --- */
    function el(tag, attr={}, children=[]) {
        const e = document.createElement(tag);
        for(let k in attr) {
            if(k==='text') e.textContent=attr[k];
            else if(k==='html') e.innerHTML=attr[k];
            else if(k==='class') e.className=attr[k];
            else e.setAttribute(k, attr[k]);
        }
        children.forEach(c => e.appendChild(c));
        return e;
    }

    function createInput(id, labelKey, type="text", phKey=null) {
        const div = el("div", {class:"col2"});
        div.appendChild(el("label", {text: res[labelKey] || labelKey}));
        const input = el(type==="textarea"?"textarea":"input", {id: id, type: type});
        if(phKey && res[phKey]) input.placeholder = res[phKey];
        div.appendChild(input);
        return div;
    }

    function createCheckGrid(containerId, optionsKeys) {
        const grid = el("div", {class: "checkbox-grid", id: containerId});
        optionsKeys.forEach(key => {
            const wrap = el("div", {class:"checkbox-item"});
            const chk = el("input", {type:"checkbox", id: key});
            wrap.onclick = (e) => {
                if(e.target !== chk) chk.checked = !chk.checked;
                wrap.classList.toggle("checked", chk.checked);
            };
            wrap.appendChild(chk);
            wrap.appendChild(el("span", {text: res[key]||key}));
            grid.appendChild(wrap);
        });
        return grid;
    }

    function createPills(containerId, optionsKeys, multiselect=true) {
        const box = el("div", {class:"pills-box", id:containerId});
        optionsKeys.forEach(k => {
            const btn = el("button", {type:"button", class:"pill", text: res[k]||k, "data-val":k});
            btn.onclick = () => {
                if(!multiselect) Array.from(box.children).forEach(c=>c.classList.remove("selected"));
                btn.classList.toggle("selected");
            };
            box.appendChild(btn);
        });
        return box;
    }

    function calculateAge(dobVal) {
        if(!dobVal) return "";
        const diff = Date.now() - new Date(dobVal).getTime();
        const ageDate = new Date(diff); 
        return Math.abs(ageDate.getUTCFullYear() - 1970);
    }

    /* --- BUILDERS --- */
    function buildForm() {
        const f = document.getElementById("adult-form");
        f.innerHTML = "";

        // 1. GENERAL
        const s1 = el("section");
        s1.appendChild(el("div", {class:"section-head", text: res["sec-gen"]}));
        const c1 = el("div", {class:"section-content"});
        
        const r1 = el("div", {class:"row-flex"});
        r1.appendChild(createInput("pt-name", "name"));
        
        const dobDiv = el("div", {class:"col2"});
        dobDiv.appendChild(el("label", {text: res["dob"]}));
        const dobIn = el("input", {id:"pt-dob", type:"date"});
        dobDiv.appendChild(dobIn);
        dobIn.onchange = () => {
            document.getElementById("pt-age").value = calculateAge(dobIn.value);
        };
        r1.appendChild(dobDiv);

        const ageDiv = el("div", {class:"col3"});
        ageDiv.appendChild(el("label", {text: res["age"]}));
        ageDiv.appendChild(el("input", {id:"pt-age", readonly:true, style:"background:#f1f5f9"}));
        r1.appendChild(ageDiv);

        c1.appendChild(r1);

        const r2 = el("div", {class:"row-flex"});
        r2.appendChild(createInput("pt-phone", "phone", "tel"));
        r2.appendChild(createInput("pt-occ", "occupation"));
        c1.appendChild(r2);
        
        const r3 = el("div", {class:"row-flex"});
        r3.appendChild(createInput("pt-edu", "education"));
        r3.appendChild(createInput("pt-living", "living", "text", "living-ph"));
        c1.appendChild(r3);

        const r4 = el("div", {class:"row-flex"});
        r4.appendChild(createInput("pt-ref", "referral"));
        r4.appendChild(createInput("pt-lang", "lang-pri"));
        c1.appendChild(r4);
        
        s1.appendChild(c1);
        f.appendChild(s1);

        // 2. MEDICAL
        const s2 = el("section");
        s2.appendChild(el("div", {class:"section-head", text: res["sec-med"]}));
        const c2 = el("div", {class:"section-content"});
        
        c2.appendChild(el("label", {text: res["med-dx"]}));
        c2.appendChild(createCheckGrid("grid-dx", ["dx-stroke","dx-tbi","dx-dementia","dx-parkinsons","dx-als","dx-cancer"]));
        
        c2.appendChild(createInput("med-onset", "onset", "date"));
        
        c2.appendChild(el("div", {class:"subsection-title", text:res["med-hist"]}));
        c2.appendChild(createPills("pills-hist", ["hist-bp","hist-dm","hist-resp","hist-cardio"]));
        
        c2.appendChild(el("div", {class:"subsection-title", text:res["sensory"]}));
        c2.appendChild(createPills("pills-sensory", ["glasses","hearing-aids","dentures"]));

        c2.appendChild(el("div", {class:"subsection-title", text:res["meds"]}));
        c2.appendChild(el("textarea", {id:"med-list"}));
        
        s2.appendChild(c2);
        f.appendChild(s2);

        // 3. COMPLAINT
        const s3 = el("section");
        s3.appendChild(el("div", {class:"section-head", text: res["sec-complaint"]}));
        const c3 = el("div", {class:"section-content"});
        c3.appendChild(createInput("complaint-desc", "concern", "textarea", "concern-ph"));
        c3.appendChild(createInput("onset-desc", "onset-desc"));
        c3.appendChild(createInput("prior-tx", "prior-tx"));
        s3.appendChild(c3);
        f.appendChild(s3);

        // 4. LANGUAGE (APHASIA)
        const s4 = el("section");
        s4.appendChild(el("div", {class:"section-head", text: res["sec-lang"]}));
        const c4 = el("div", {class:"section-content"});
        
        c4.appendChild(el("label", {text: res["lang-exp"]}));
        c4.appendChild(createCheckGrid("grid-exp", ["exp-anomia","exp-fluency","exp-sentences","exp-jargon"]));
        
        c4.appendChild(el("label", {text: res["lang-rec"]}));
        c4.appendChild(createCheckGrid("grid-rec", ["rec-commands","rec-convo","rec-reading","rec-writing"]));
        
        s4.appendChild(c4);
        f.appendChild(s4);

        // 5. MOTOR SPEECH
        const s5 = el("section");
        s5.appendChild(el("div", {class:"section-head", text: res["sec-motor"]}));
        const c5 = el("div", {class:"section-content"});
        
        c5.appendChild(el("label", {text: res["speech-char"]}));
        c5.appendChild(createCheckGrid("grid-speech", ["sp-slurred","sp-fast","sp-soft","sp-strain","sp-apraxia"]));
        
        c5.appendChild(el("label", {text: res["voice-qual"]}));
        c5.appendChild(createPills("pills-voice", ["v-hoarse","v-breath","v-nasal"]));
        
        s5.appendChild(c5);
        f.appendChild(s5);

        // 6. SWALLOWING
        const s6 = el("section");
        s6.appendChild(el("div", {class:"section-head", text: res["sec-swallow"]}));
        const c6 = el("div", {class:"section-content"});
        
        c6.appendChild(el("label", {text: "Signs & Symptoms"}));
        c6.appendChild(createCheckGrid("grid-dys", ["dys-liq","dys-sol","dys-pills","dys-cough","dys-sensation"]));
        
        c6.appendChild(el("div", {class:"subsection-title", text:res["diet-curr"]}));
        c6.appendChild(createPills("pills-diet", ["diet-reg","diet-soft","diet-puree","liq-thin","liq-thick"]));
        
        s6.appendChild(c6);
        f.appendChild(s6);

        // 7. COGNITION
        const s7 = el("section");
        s7.appendChild(el("div", {class:"section-head", text: res["sec-cog"]}));
        const c7 = el("div", {class:"section-content"});
        c7.appendChild(el("label", {text: res["cog-deficits"]}));
        c7.appendChild(createCheckGrid("grid-cog", ["cog-mem","cog-att","cog-prob","cog-orient","cog-safe"]));
        s7.appendChild(c7);
        f.appendChild(s7);

        // 8. SUMMARY
        const s8 = el("section");
        s8.appendChild(el("div", {class:"section-head", text: res["notes"]}));
        const c8 = el("div", {class:"section-content"});
        
        const genBtn = el("button", {type:"button", class:"btn btn-magic", text: res["auto-btn"]});
        genBtn.onclick = generateSummary;
        c8.appendChild(genBtn);
        
        c8.appendChild(el("textarea", {id:"clinical-notes", style:"min-height:150px; margin-top:15px; font-family:monospace"}));
        s8.appendChild(c8);
        f.appendChild(s8);
    }

    /* --- LOGIC --- */
    function getVals(id, isPill=false) {
        if(isPill) return Array.from(document.querySelectorAll(`#${id} .pill.selected`)).map(e=>e.innerText);
        // Checkbox grid
        return Array.from(document.querySelectorAll(`#${id} .checkbox-item.checked span`)).map(e=>e.innerText);
    }

    function generateSummary() {
        const v = (id) => document.getElementById(id).value;
        const name = v("pt-name") || (lang==='ar'?"المريض":"The patient");
        const age = v("pt-age");
        const complaint = v("complaint-desc");
        
        const dx = getVals("grid-dx").join(", ");
        const hist = getVals("pills-hist", true).join(", ");
        
        const langIssues = [...getVals("grid-exp"), ...getVals("grid-rec")];
        const speechIssues = [...getVals("grid-speech"), ...getVals("pills-voice", true)];
        const dysIssues = [...getVals("grid-dys"), ...getVals("pills-diet", true)];
        const cogIssues = getVals("grid-cog");

        let txt = "";
        
        if (lang === 'en') {
            txt += `CLINICAL SUMMARY:\n`;
            txt += `${name}, a ${age}-year-old individual, presented for assessment regarding ${complaint || "speech-language concerns"}.\n\n`;
            
            if(dx) txt += `MEDICAL HISTORY:\nPrimary diagnosis: ${dx}. Additional history: ${hist || "Unremarkable"}.\n\n`;
            
            if(langIssues.length) txt += `LANGUAGE & COMMUNICATION:\nPatient demonstrates: ${langIssues.join(", ")}.\n\n`;
            if(speechIssues.length) txt += `MOTOR SPEECH & VOICE:\nCharacteristics noted: ${speechIssues.join(", ")}.\n\n`;
            if(dysIssues.length) txt += `SWALLOWING/DYSPHAGIA:\nReported difficulties: ${dysIssues.join(", ")}.\n\n`;
            if(cogIssues.length) txt += `COGNITION:\nDeficits noted in: ${cogIssues.join(", ")}.\n\n`;
            
            txt += `RECOMMENDATIONS:\nComprehensive evaluation is recommended to establish baseline function and treatment goals.`;
        } else {
            txt += `الملخص السريري:\n`;
            txt += `حضر المريض ${name} (${age} سنة) للتقييم بسبب ${complaint || "مشاكل في التواصل"}.\n\n`;
            
            if(dx) txt += `التاريخ الطبي:\nالتشخيص الأساسي: ${dx}. تاريخ مرضي آخر: ${hist || "لا يوجد"}.\n\n`;
            
            if(langIssues.length) txt += `اللغة والتواصل:\nيظهر المريض: ${langIssues.join("، ")}.\n\n`;
            if(speechIssues.length) txt += `النطق والصوت:\nالملاحظات: ${speechIssues.join("، ")}.\n\n`;
            if(dysIssues.length) txt += `البلع:\nالصعوبات المبلغ عنها: ${dysIssues.join("، ")}.\n\n`;
            if(cogIssues.length) txt += `القدرات الذهنية:\nقصور في: ${cogIssues.join("، ")}.\n\n`;
            
            txt += `التوصيات:\nيوصى بإجراء تقييم شامل لتحديد مستوى الأداء الحالي ووضع خطة علاجية.`;
        }
        
        document.getElementById("clinical-notes").value = txt;
    }

    /* --- EXPORT/PRINT --- */
    document.getElementById("btn-export").onclick = () => {
        const v = (id) => document.getElementById(id) ? document.getElementById(id).value : "";
        let lines = [`=== ${res['title']} ===`, `Date: ${new Date().toLocaleDateString()}`];
        
        lines.push(`Name: ${v("pt-name")}`);
        lines.push(`Age: ${v("pt-age")}`);
        lines.push(`Complaint: ${v("complaint-desc")}`);
        
        const addSection = (title, content) => { if(content && content.length) lines.push(`\n[${title}]\n${content}`); };
        
        addSection("Diagnosis", getVals("grid-dx").join(", "));
        addSection("History", getVals("pills-hist", true).join(", "));
        addSection("Language", [...getVals("grid-exp"), ...getVals("grid-rec")].join(", "));
        addSection("Swallowing", getVals("grid-dys").join(", "));
        addSection("Cognition", getVals("grid-cog").join(", "));
        addSection("Notes", v("clinical-notes"));
        
        const blob = new Blob([lines.join("\n")], {type: "text/plain;charset=utf-8"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Adult_Assessment_${v("pt-name")||"Patient"}.txt`;
        link.click();
    };

    document.getElementById("btn-print").onclick = () => {
        const pc = document.getElementById("print-content");
        pc.innerHTML = "";
        
        const addRow = (lbl, val) => {
            if(!val || val.trim()==="") return;
            const r = el("div", {class:"print-row"});
            r.innerHTML = `<div class="print-label">${lbl}:</div><div class="print-value">${val}</div>`;
            pc.appendChild(r);
        };
        const addHead = (txt) => {
            const h = el("h3", {text: txt});
            const d = el("div", {class:"print-section"});
            d.appendChild(h);
            pc.appendChild(d);
            return d;
        }

        const v = (id) => document.getElementById(id) ? document.getElementById(id).value : "";
        
        // Gen
        const s1 = addHead(res["sec-gen"]);
        s1.appendChild(el("div", {class:"print-row", html:`<div class="print-label">${res["name"]}:</div><div class="print-value">${v("pt-name")}</div>`}));
        s1.appendChild(el("div", {class:"print-row", html:`<div class="print-label">${res["age"]}:</div><div class="print-value">${v("pt-age")}</div>`}));
        s1.appendChild(el("div", {class:"print-row", html:`<div class="print-label">${res["phone"]}:</div><div class="print-value">${v("pt-phone")}</div>`}));
        
        // Med
        const s2 = addHead(res["sec-med"]);
        let dx = getVals("grid-dx").join(", ");
        if(dx) s2.appendChild(el("div", {class:"print-row", html:`<div class="print-label">${res["med-dx"]}:</div><div class="print-value">${dx}</div>`}));
        let meds = v("med-list");
        if(meds) s2.appendChild(el("div", {class:"print-row", html:`<div class="print-label">${res["meds"]}:</div><div class="print-value">${meds}</div>`}));
        
        // Findings
        const s3 = addHead("Clinical Findings");
        const pushFindings = (lbl, arr) => {
            if(arr.length) s3.appendChild(el("div", {class:"print-row", html:`<div class="print-label">${lbl}:</div><div class="print-value">${arr.join(", ")}</div>`}));
        };
        pushFindings(res["sec-lang"], [...getVals("grid-exp"), ...getVals("grid-rec")]);
        pushFindings(res["sec-swallow"], [...getVals("grid-dys"), ...getVals("pills-diet", true)]);
        pushFindings(res["sec-cog"], getVals("grid-cog"));

        // Notes
        const n = v("clinical-notes");
        if(n) {
            const s4 = addHead(res["notes"]);
            const p = el("p", {text: n, style:"white-space:pre-wrap"});
            s4.appendChild(p);
        }

        document.getElementById("print-title").innerText = res["title"];
        window.print();
    };

    /* --- INIT --- */
    document.getElementById("lang-toggle").addEventListener("change", (e) => {
        lang = e.target.checked ? "ar" : "en";
        res = translations[lang];
        document.getElementById(lang==="ar"?"label-ar":"label-en").classList.add("active");
        document.getElementById(lang==="ar"?"label-en":"label-ar").classList.remove("active");
        document.documentElement.dir = lang==="ar"?"rtl":"ltr";
        buildForm();
    });

    buildForm();
</script>
</body>
</html>
